version: rudder/v1
kind: destination
metadata:
  name: postgres-s3-role
spec:
  id: postgres-s3-role
  display_name: E2E Postgres S3 Role
  type: postgres
  enabled: true
  definition_version: 1
  config:
    host: postgres-s3-role.rudder-cli-e2e.internal
    database: analytics
    user: rudder
    password: "{{ .POSTGRES_PASSWORD }}"
    port: "5432"
    namespace: rudder_e2e_s3_role
    ssl_mode: disable
    sync_frequency: "180"
    use_rudder_storage: false
    bucket_provider: S3
    bucket_name: rudder-cli-e2e
    role_based_auth: true
    iam_role_arn: arn:aws:iam::123456789012:role/rudder-cli-e2e
