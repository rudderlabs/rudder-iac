version: rudder/v1
kind: destination
metadata:
  name: firebase
spec:
  id: firebase
  display_name: E2E Firebase
  type: firebase
  enabled: true
  definition_version: 1
  config:
    use_native_sdk:
      android: true
      android_kotlin: true
      ios: true
      ios_swift: true
      unity: true
      react_native: true
      flutter: true
    connection_mode:
      android: device
      android_kotlin: device
      ios: device
      ios_swift: device
      unity: device
      react_native: device
      flutter: device
    consent_management:
      android:
        - provider: oneTrust
          consents:
            - C0001
            - C0002
        - provider: ketch
          consents:
            - analytics
      ios:
        - provider: oneTrust
          consents:
            - C0003
      flutter:
        - provider: ketch
          consents:
            - advertising
    event_filtering:
      whitelist:
        - Order Completed
        - Product Viewed
