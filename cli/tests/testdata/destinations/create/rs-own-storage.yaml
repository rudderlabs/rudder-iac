version: rudder/v1
kind: destination
metadata:
  name: rs-own-storage
spec:
  id: rs-own-storage
  display_name: E2E Redshift Own Storage
  type: rs
  enabled: true
  definition_version: 1
  config:
    use_iam_for_auth: false
    host: rudder-cli-e2e-storage.redshift.amazonaws.com
    port: "5439"
    database: analytics
    user: rudder
    password: "{{ .RS_PASSWORD }}"
    namespace: rudder_events_storage
    sync_frequency: "180"
    use_rudder_storage: false
    bucket_name: rudder-cli-e2e-rs
    prefix: rudder/rs/
    role_based_auth: false
    access_key_id: "{{ .RS_ACCESS_KEY_ID }}"
    access_key: "{{ .RS_ACCESS_KEY }}"
    enable_sse: false
