version: rudder/v1
kind: destination
metadata:
  name: rs-iam-cluster
spec:
  id: rs-iam-cluster
  display_name: E2E Redshift IAM Cluster
  type: rs
  enabled: true
  definition_version: 1
  config:
    use_iam_for_auth: true
    iam_role_arn_for_auth: arn:aws:iam::123456789012:role/rudder-cli-e2e-rs
    cluster_region: us-east-1
    use_serverless: false
    cluster_id: rudder-cli-e2e-cluster
    database: analytics
    user: rudder
    namespace: rudder_events_cluster
    sync_frequency: "180"
    use_rudder_storage: true
    underscore_divide_numbers: false
    allow_users_context_traits: false
