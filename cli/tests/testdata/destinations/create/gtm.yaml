version: rudder/v1
kind: destination
metadata:
  name: gtm
spec:
  id: gtm
  display_name: E2E GTM
  type: gtm
  enabled: true
  definition_version: 1
  config:
    container_id: "{{ .GTM_CONTAINER_ID }}"
    server_url: https://sgtm.rudder-cli-e2e.com
    environment_id: env-5
    authorization_token: "{{ .GTM_AUTHORIZATION_TOKEN }}"
    event_filtering:
      whitelist:
        - Order Completed
        - Product Viewed
    connection_mode:
      web: device
