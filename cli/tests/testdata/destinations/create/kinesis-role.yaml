version: rudder/v1
kind: destination
metadata:
  name: kinesis-role
spec:
  id: kinesis-role
  display_name: E2E Kinesis Role Auth
  type: kinesis
  enabled: true
  definition_version: 1
  config:
    region: us-west-2
    stream: rudder-cli-e2e-role
    role_based_auth: true
    iam_role_arn: "arn:aws:iam::123456789012:role/KinesisAccess"
