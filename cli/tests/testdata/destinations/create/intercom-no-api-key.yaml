version: rudder/v1
kind: destination
metadata:
  name: intercom-no-api-key
spec:
  id: intercom-no-api-key
  display_name: E2E Intercom No API Key
  type: intercom
  enabled: true
  definition_version: 1
  config:
    app_id: "{{ .INTERCOM_NO_API_KEY_APP_ID }}"
    api_server: standard
    api_version: v2
    send_anonymous_id: false
    update_last_request_at: true
    mobile_api_key_android: "{{ .INTERCOM_NO_API_KEY_MOBILE_API_KEY_ANDROID }}"
    mobile_api_key_ios: "{{ .INTERCOM_NO_API_KEY_MOBILE_API_KEY_IOS }}"
