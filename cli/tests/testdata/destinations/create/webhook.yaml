version: rudder/v1
kind: destination
metadata:
  name: webhook
spec:
  id: webhook
  display_name: E2E Webhook
  type: webhook
  enabled: true
  definition_version: 1
  config:
    webhook_url: https://webhooks.example.com/rudder
    webhook_method: POST
    headers:
      - from: X-Rudder-Token
        to: "{{ .WEBHOOK_HEADER_TOKEN }}"
    connection_mode:
      web: cloud
      android_kotlin: cloud
