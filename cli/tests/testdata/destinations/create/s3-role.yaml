version: rudder/v1
kind: destination
metadata:
  name: s3-role
spec:
  id: s3-role
  display_name: E2E S3 Role Auth
  type: s3
  enabled: true
  definition_version: 1
  config:
    bucket_name: rudder-cli-e2e
    prefix: rudder/
    role_based_auth: true
    iam_role_arn: "arn:aws:iam::123456789012:role/S3Access"
