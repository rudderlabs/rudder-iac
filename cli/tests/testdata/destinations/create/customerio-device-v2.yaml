version: rudder/v1
kind: destination
metadata:
  name: customerio-device-v2
spec:
  id: customerio-device-v2
  display_name: E2E Customer.io Device V2
  type: customerio
  enabled: true
  definition_version: 1
  config:
    api_version: v2
    user_id_identifier_type: id
    sdk_version:
      web: v2
    write_key:
      web: customerio-e2e-write-key
    anonymous_in_app:
      web: false
    datacenter: US
    device_token_event_name: Device Token Registered
    event_filtering:
      whitelist:
        - Order Completed
    send_page_name_in_sdk:
      web: false
    auto_track_device_attributes:
      android: false
      ios: false
    background_queue_min_number_of_tasks:
      android: "10"
    background_queue_seconds_delay:
      android: "30"
    connection_mode:
      web: device
