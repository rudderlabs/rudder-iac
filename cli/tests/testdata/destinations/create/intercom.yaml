version: rudder/v1
kind: destination
metadata:
  name: intercom
spec:
  id: intercom
  display_name: E2E Intercom
  type: intercom
  enabled: true
  definition_version: 1
  config:
    app_id: "{{ .INTERCOM_APP_ID }}"
    api_key: "{{ .INTERCOM_API_KEY }}"
    api_server: standard
    api_version: v2
    send_anonymous_id: false
    update_last_request_at: true
    event_filtering:
      whitelist:
        - Order Completed
    mobile_api_key_android: "{{ .INTERCOM_MOBILE_API_KEY_ANDROID }}"
    mobile_api_key_ios: "{{ .INTERCOM_MOBILE_API_KEY_IOS }}"
    connection_mode:
      web: cloud
      android_kotlin: cloud
