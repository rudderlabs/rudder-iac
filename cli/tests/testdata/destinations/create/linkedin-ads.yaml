  display_name: E2E LinkedIn Ads
  type: linkedin_ads
  enabled: true
  definition_version: 1
  config:
    rudder_account_id: "1234567890"
    hash_data: true
    ad_account_id: "urn:li:sponsoredAccount:123456789"
