version: rudder/v1
kind: destination
metadata:
  name: kafka
spec:
  id: kafka
  display_name: E2E Kafka
  type: kafka
  enabled: true
  definition_version: 1
  config:
    host_name: "{{ .KAFKA_HOST_NAME }}"
    port: "9092"
    topic: rudder-cli-e2e
    ssl_enabled: true
    ca_certificate: "-----BEGIN CERTIFICATE-----\nrudderCliE2eKafkaCa\n-----END CERTIFICATE-----"
    use_sasl: true
    sasl_type: sha256
    username: "{{ .KAFKA_USERNAME }}"
    password: "{{ .KAFKA_PASSWORD }}"
    convert_to_avro: false
    enable_multi_topic: false
    use_ssh: false
    connection_mode:
      web: cloud
      android_kotlin: cloud
