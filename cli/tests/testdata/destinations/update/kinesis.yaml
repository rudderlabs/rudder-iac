version: rudder/v1
kind: destination
metadata:
  name: kinesis
spec:
  id: kinesis
  display_name: E2E Kinesis Key Auth Updated
  type: kinesis
  enabled: true
  definition_version: 1
  config:
    region: us-east-2
    stream: rudder-cli-e2e-updated
    role_based_auth: false
    access_key_id: "{{ .KINESIS_ACCESS_KEY_ID }}"
    access_key: "{{ .KINESIS_ACCESS_KEY }}"
    use_message_id: true
    connection_mode:
      web: cloud
      android_kotlin: cloud
