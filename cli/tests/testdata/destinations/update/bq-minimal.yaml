version: rudder/v1
kind: destination
metadata:
  name: bq-minimal
spec:
  id: bq-minimal
  display_name: E2E BigQuery Minimal Updated
  type: bq
  enabled: true
  definition_version: 1
  config:
    project: rudder-cli-e2e
    bucket_name: rudder-cli-e2e-bq-minimal-updated
    credentials: '{{ .BQ_CREDENTIALS }}'
    sync_frequency: "360"
