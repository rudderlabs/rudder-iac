version: rudder/v1
kind: destination
metadata:
  name: postgres-minio
spec:
  id: postgres-minio
  display_name: E2E Postgres MinIO Updated
  type: postgres
  enabled: true
  definition_version: 1
  config:
    host: postgres-minio.rudder-cli-e2e.internal
    database: analytics
    user: rudder
    password: "{{ .POSTGRES_PASSWORD }}"
    port: "5432"
    namespace: rudder_e2e_minio_updated
    ssl_mode: disable
    sync_frequency: "360"
    use_rudder_storage: false
    bucket_provider: MINIO
    bucket_name: rudder-cli-e2e-updated
    end_point: minio-updated.rudder-cli-e2e.internal:9000
    access_key_id: "{{ .POSTGRES_MINIO_ACCESS_KEY_ID }}"
    secret_access_key: "{{ .POSTGRES_MINIO_SECRET_ACCESS_KEY }}"
    use_ssl: false
