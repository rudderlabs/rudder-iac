version: rudder/v1
kind: destination
metadata:
  name: braze
spec:
  id: braze
  display_name: E2E Braze Updated
  type: braze
  enabled: true
  definition_version: 1
  config:
    data_center: EU-01
    rest_api_key: "{{ .BRAZE_REST_API_KEY }}"
    app_key: rudder-cli-e2e-app-key-updated
    use_platform_specific_api_keys: false
    enable_subscription_group_in_group_call: true
    enable_nested_array_operations: true
    send_purchase_event_with_extra_properties: true
    support_dedup: true
    use_ecommerce_recommended_events: false
    event_filtering:
      blacklist:
        - Page Viewed
    use_native_sdk:
      web: false
      android: true
    track_anonymous_user:
      web: true
    enable_braze_logging:
      web: true
    enable_push_notification:
      web: true
    allow_user_supplied_javascript:
      web: true
    consent_management:
      web:
        - provider: oneTrust
          consents:
            - analytics
    connection_mode:
      web: cloud
      android_kotlin: cloud
