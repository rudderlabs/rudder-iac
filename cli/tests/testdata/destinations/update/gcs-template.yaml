version: rudder/v1
kind: destination
metadata:
  name: gcs-template
spec:
  id: gcs-template
  display_name: E2E GCS Template Config Updated
  type: gcs
  enabled: true
  definition_version: 1
  config:
    bucket_name: '{{ config.bucketName || rudder-cli-e2e-gcs }}'
    prefix: '{{ config.prefix || rudder/gcs/updated/ }}'
    credentials: '{{ .GCS_CREDENTIALS }}'
    connection_mode:
      web: cloud
