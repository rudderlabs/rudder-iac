version: rudder/v1
kind: destination
metadata:
  name: intercom
spec:
  id: intercom
  display_name: E2E Intercom Updated
  type: intercom
  enabled: true
  definition_version: 1
  config:
    app_id: "{{ .INTERCOM_APP_ID_UPDATED }}"
    api_key: "{{ .INTERCOM_API_KEY }}"
    api_server: eu
    api_version: v1
    send_anonymous_id: true
    update_last_request_at: false
    event_filtering:
      blacklist:
        - Page Viewed
    mobile_api_key_android: "{{ .INTERCOM_MOBILE_API_KEY_ANDROID_UPDATED }}"
    mobile_api_key_ios: "{{ .INTERCOM_MOBILE_API_KEY_IOS_UPDATED }}"
    consent_management:
      web:
        - provider: oneTrust
          consents:
            - analytics
    connection_mode:
      web: cloud
      android_kotlin: cloud
