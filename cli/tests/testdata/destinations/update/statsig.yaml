version: rudder/v1
kind: destination
metadata:
  name: statsig
spec:
  id: statsig
  display_name: E2E Statsig Updated
  type: statsig
  enabled: true
  definition_version: 1
  config:
    secret_key: "{{ .STATSIG_SECRET_KEY }}"
    consent_management:
      web:
        - provider: oneTrust
          consents:
            - analytics
    connection_mode:
      web: cloud
      android_kotlin: cloud
