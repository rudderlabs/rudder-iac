version: rudder/v1
kind: destination
metadata:
  name: active-campaign
spec:
  id: active-campaign
  display_name: E2E ActiveCampaign Updated
  type: active_campaign
  enabled: true
  definition_version: 1
  config:
    api_url: https://rudder-cli-e2e-updated.api-us2.com
    api_key: "{{ .ACTIVE_CAMPAIGN_API_KEY }}"
    actid: "67890"
    event_key: "{{ .ACTIVE_CAMPAIGN_EVENT_KEY }}"
    use_native_sdk:
      web: true
    consent_management:
      web:
        - provider: oneTrust
          consents:
            - analytics
    connection_mode:
      web: cloud
      android_kotlin: cloud
