version: rudder/v1
kind: destination
metadata:
  name: snowflake
spec:
  id: snowflake
  display_name: E2E Snowflake Updated
  type: snowflake
  enabled: true
  definition_version: 1
  config:
    account: rudder-cli-e2e.us-east-1
    database: RUDDER_E2E_UPDATED
    warehouse: RUDDER_WH_UPDATED
    user: RUDDER_CLI_E2E
    use_key_pair_auth: false
    password: "{{ .SNOWFLAKE_PASSWORD }}"
    role: RUDDER_ROLE
    namespace: rudder_cli_e2e
    sync:
      frequency: "360"
    skip_tracks_table: false
    skip_users_table: true
    prefer_append: true
    manual_sync: false
    underscore_divide_numbers: false
    allow_users_context_traits: false
    use_rudder_storage: true
