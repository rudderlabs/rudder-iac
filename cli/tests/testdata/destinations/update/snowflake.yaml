version: rudder/v1
kind: destination
metadata:
  name: snowflake
spec:
  id: snowflake
  display_name: E2E Snowflake Updated
  type: snowflake
  enabled: true
  definition_version: 1
  config:
    account: rudder-cli-e2e.us-east-1
    database: RUDDER_E2E_UPD
    warehouse: RUDDER_WH
    user: RUDDER_CLI_E2E
    role: RUDDER_ROLE
    namespace: rudder_cli_e2e
    use_key_pair_auth: false
    password: "{{ .SNOWFLAKE_PASSWORD }}"
    sync_frequency: "360"
    sync_start_at: "01:00"
    exclude_window:
      start_time: "04:00"
      end_time: "05:00"
    skip_tracks_table: false
    skip_users_table: true
    prefer_append: true
    manual_sync: false
    underscore_divide_numbers: false
    allow_users_context_traits: false
    use_rudder_storage: true
