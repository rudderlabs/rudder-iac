version: rudder/v1
kind: destination
metadata:
  name: salesforce
spec:
  id: salesforce
  display_name: E2E Salesforce Updated
  type: salesforce
  enabled: true
  definition_version: 1
  config:
    user_name: "{{ .SALESFORCE_USER_NAME }}"
    password: "{{ .SALESFORCE_PASSWORD }}"
    initial_access_token: "{{ .SALESFORCE_INITIAL_ACCESS_TOKEN }}"
    map_properties: false
    sandbox: true
    use_contact_id: true
    connection_mode:
      web: cloud
      android_kotlin: cloud
