version: rudder/v1
kind: destination
metadata:
  name: postgres-s3-keys
spec:
  id: postgres-s3-keys
  display_name: E2E Postgres S3 Keys Updated
  type: postgres
  enabled: true
  definition_version: 1
  config:
    host: postgres-s3.rudder-cli-e2e.internal
    database: analytics
    user: "{{ .POSTGRES_S3_KEYS_USER }}"
    password: "{{ .POSTGRES_PASSWORD }}"
    port: "5432"
    namespace: rudder_e2e_s3_updated
    ssl_mode: disable
    sync_frequency: "360"
    use_rudder_storage: false
    bucket_provider: S3
    bucket_name: rudder-cli-e2e-updated
    access_key_id: "{{ .POSTGRES_ACCESS_KEY_ID }}"
    s3:
      role_based_auth: false
      access_key: "{{ .POSTGRES_ACCESS_KEY }}"
    prefer_append: true
