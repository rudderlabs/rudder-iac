version: rudder/v1
kind: destination
metadata:
  name: rs-ssh
spec:
  id: rs-ssh
  display_name: E2E Redshift SSH Updated
  type: rs
  enabled: true
  definition_version: 1
  config:
    use_iam_for_auth: false
    host: rudder-cli-e2e-ssh.redshift.amazonaws.com
    port: "5439"
    database: analytics
    user: "{{ .RS_SSH_DB_USER }}"
    password: "{{ .RS_PASSWORD }}"
    namespace: rudder_events_ssh
    use_ssh: true
    ssh:
      host: bastion.rudder-cli-e2e.internal
      port: "22"
      user: "{{ .RS_SSH_USER_UPDATED }}"
      public_key: ssh-rsa AAAAB3NzaC1yc2EAAAADAQABrudderE2E
    sync_frequency: "360"
    use_rudder_storage: true
    underscore_divide_numbers: false
    allow_users_context_traits: false
