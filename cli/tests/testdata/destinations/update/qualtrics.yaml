version: rudder/v1
kind: destination
metadata:
  name: qualtrics
spec:
  id: qualtrics
  display_name: E2E Qualtrics Updated
  type: qualtrics
  enabled: true
  definition_version: 1
  config:
    project_id: rudderCliE2eFullProjectUpdated
    brand_id: rudderCliE2eFullBrandUpdated
    enable_generic_page_title:
      web: false
    use_native_sdk:
      web: true
      android: true
      ios: true
    connection_mode:
      web: device
      android: device
      ios: device
    event_filtering:
      blacklist:
        - Application Opened
    consent_management:
      web:
        - provider: oneTrust
          resolution_strategy: and
          consents:
            - analytics
