version: rudder/v1
kind: destination
metadata:
  name: facebook-pixel
spec:
  id: facebook-pixel
  display_name: E2E Facebook Pixel Updated
  type: facebook_pixel
  enabled: true
  definition_version: 1
  config:
    pixel_id: "6543210987654321"
    access_token: "{{ .FACEBOOK_PIXEL_ACCESS_TOKEN }}"
    standard_page_call: false
    value_field_identifier: properties.price
    advanced_mapping: true
    limited_data_usage: true
    test_destination: true
    test_event_code: TEST67890
    remove_external_id: true
    use_updated_mapping: true
    events_to_events:
      - from: Order Completed
        to: Lead
    blacklist_pii_properties:
      - property: email
        hash: false
    whitelist_pii_properties:
      - property: plan
    event_filtering:
      blacklist:
        - Page Viewed
    use_native_sdk:
      web: false
    auto_config:
      web: false
    legacy_conversion_pixel_id:
      web:
        - from: Product Viewed
          to: "1111111111"
    consent_management:
      web:
        - provider: oneTrust
          consents:
            - analytics
    connection_mode:
      web: cloud
      android_kotlin: cloud
