version: rudder/v1
kind: destination
metadata:
  name: rs
spec:
  id: rs
  display_name: E2E Redshift Updated
  type: rs
  enabled: true
  definition_version: 1
  config:
    use_iam_for_auth: false
    host: rudder-cli-e2e.redshift.amazonaws.com
    port: "5439"
    database: analytics
    user: rudder
    password: "{{ .RS_PASSWORD }}"
    namespace: rudder_events
    sync_frequency: "360"
    use_rudder_storage: true
    skip_tracks_table: true
    skip_users_table: true
