version: rudder/v1
kind: destination
metadata:
  name: redis
spec:
  id: redis
  display_name: E2E Redis Updated
  type: redis
  enabled: true
  definition_version: 1
  config:
    address: redis-updated.example.com:6379
    password: "{{ .REDIS_PASSWORD }}"
    prefix: rudder-cli-e2e-updated
    database: "1"
    cluster_mode: false
    secure: false
    skip_verify: false
    use_json_module: true
    consent_management:
      web:
        - provider: oneTrust
          consents:
            - analytics
