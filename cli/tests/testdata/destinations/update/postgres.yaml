version: rudder/v1
kind: destination
metadata:
  name: postgres
spec:
  id: postgres
  display_name: E2E Postgres Updated
  type: postgres
  enabled: true
  definition_version: 1
  config:
    host: postgres.rudder-cli-e2e.internal
    database: analytics_updated
    user: rudder
    password: "{{ .POSTGRES_PASSWORD }}"
    port: "5432"
    namespace: rudder_e2e_updated
    ssl_mode: require
    sync_frequency: "360"
    use_rudder_storage: true
    skip_tracks_table: true
    skip_users_table: true
    prefer_append: true
    connection_mode:
      web: cloud
      android_kotlin: cloud
