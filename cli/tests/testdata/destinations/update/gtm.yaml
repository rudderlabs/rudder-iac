version: rudder/v1
kind: destination
metadata:
  name: gtm
spec:
  id: gtm
  display_name: E2E GTM Updated
  type: gtm
  enabled: true
  definition_version: 1
  config:
    container_id: "{{ .GTM_CONTAINER_ID_UPDATED }}"
    server_url: sgtm-updated.rudder-cli-e2e.com/collect
    environment_id: env-9
    authorization_token: "{{ .GTM_AUTHORIZATION_TOKEN_UPDATED }}"
    event_filtering:
      blacklist:
        - Application Opened
    consent_management:
      web:
        - provider: oneTrust
          resolution_strategy: and
          consents:
            - analytics
            - marketing
    connection_mode:
      web: device
