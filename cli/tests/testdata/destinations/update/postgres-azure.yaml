version: rudder/v1
kind: destination
metadata:
  name: postgres-azure
spec:
  id: postgres-azure
  display_name: E2E Postgres Azure Updated
  type: postgres
  enabled: true
  definition_version: 1
  config:
    host: postgres-azure.rudder-cli-e2e.internal
    database: analytics
    user: rudder
    password: "{{ .POSTGRES_PASSWORD }}"
    port: "5432"
    namespace: rudder_e2e_azure_updated
    ssl_mode: disable
    sync_frequency: "360"
    use_rudder_storage: false
    bucket_provider: AZURE_BLOB
    container_name: rudder-cli-e2e-updated
    account_name: ruddercliE2e
    use_sas_tokens: true
    sas_token: "{{ .POSTGRES_AZURE_SAS_TOKEN }}"
