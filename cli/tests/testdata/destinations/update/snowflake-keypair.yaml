version: rudder/v1
kind: destination
metadata:
  name: snowflake-keypair
spec:
  id: snowflake-keypair
  display_name: E2E Snowflake Key Pair Updated
  type: snowflake
  enabled: true
  definition_version: 1
  config:
    account: rudder-cli-e2e.us-east-1
    database: RUDDER_E2E_KP2
    warehouse: RUDDER_WH_KP2
    user: RUDDER_CLI_E2E
    use_key_pair_auth: true
    private_key: "{{ .SNOWFLAKE_PRIVATE_KEY }}"
    private_key_passphrase: "{{ .SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}"
    namespace: rudder_cli_e2e_kp
    sync:
      frequency: "1440"
    skip_tracks_table: false
    skip_users_table: true
    prefer_append: true
    manual_sync: false
    underscore_divide_numbers: false
    allow_users_context_traits: false
    use_rudder_storage: false
    cleanup_object_storage_files: false
    prefix: rudder-cli-e2e
    s3:
      bucket_name: rudder-cli-e2e-bucket-updated
      storage_integration: RUDDER_S3_INTEGRATION
      enable_sse: false
      role_based_authentication:
        i_am_role_arn: arn:aws:iam::000000000000:role/rudder-cli-e2e
