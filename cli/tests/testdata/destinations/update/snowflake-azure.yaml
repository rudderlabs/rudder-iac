version: rudder/v1
kind: destination
metadata:
  name: snowflake-azure
spec:
  id: snowflake-azure
  display_name: E2E Snowflake Azure Updated
  type: snowflake
  enabled: true
  definition_version: 1
  config:
    account: rudder-cli-e2e.us-east-1
    database: RUDDER_E2E_AZ_UPD
    warehouse: RUDDER_WH
    user: RUDDER_CLI_E2E
    use_key_pair_auth: false
    password: "{{ .SNOWFLAKE_PASSWORD }}"
    namespace: rudder_cli_e2e_az
    sync:
      frequency: "360"
    skip_tracks_table: false
    skip_users_table: true
    prefer_append: true
    manual_sync: false
    underscore_divide_numbers: false
    allow_users_context_traits: false
    use_rudder_storage: false
    cleanup_object_storage_files: false
    azure:
      container_name: ruddercliE2e-updated
      account_name: ruddercliE2e
      account_key: notARealAzureAccountKey-updated
      storage_integration: RUDDER_AZURE_INTEGRATION
      use_sas_tokens: false
      sas_token: notARealSasToken-updated
