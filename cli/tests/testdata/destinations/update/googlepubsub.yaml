version: rudder/v1
kind: destination
metadata:
  name: googlepubsub
spec:
  id: googlepubsub
  display_name: E2E Google PubSub Updated
  type: googlepubsub
  enabled: true
  definition_version: 1
  config:
    project_id: rudder-cli-e2e-updated
    credentials: "{{ .GOOGLE_PUBSUB_CREDENTIALS }}"
    event_to_topic_map:
      - from: Product Viewed
        to: product-events-updated
      - from: Checkout Started
        to: checkout-events
