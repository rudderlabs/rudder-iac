version: rudder/v1
kind: destination
metadata:
  name: adobe-analytics
spec:
  id: adobe-analytics
  display_name: E2E Adobe Analytics Updated
  type: adobe_analytics
  enabled: true
  definition_version: 1
  config:
    report_suite_ids: rudderCliE2eRsidUpdated
    tracking_server_url: metrics-updated.example.com
    tracking_server_secure_url: secure-updated.example.com
    ssl_heartbeat: false
    heartbeat_tracking_server_url: heartbeat-updated.example.com
    marketing_cloud_org_id: rudderCliE2eOrgIdUpdated
    drop_visitor_id: true
    timestamp_option: enabled
    timestamp_optional_reporting: false
    prefer_visitor_id: false
    track_page_name: false
    context_data_prefix: "rudder2."
    product_identifier: id
    e_var_mapping:
      - from: tier
        to: "2"
    context_data_mapping:
      - from: source
        to: sourceName
    use_native_sdk:
      web: false
    connection_mode:
      web: cloud
    event_filtering:
      blacklist:
        - Application Opened
    consent_management:
      web:
        - provider: oneTrust
          resolution_strategy: and
          consents:
            - analytics
