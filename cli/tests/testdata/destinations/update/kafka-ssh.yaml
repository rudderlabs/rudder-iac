version: rudder/v1
kind: destination
metadata:
  name: kafka-ssh
spec:
  id: kafka-ssh
  display_name: E2E Kafka SSH Updated
  type: kafka
  enabled: true
  definition_version: 1
  config:
    host_name: kafka-ssh.rudder-cli-e2e.internal
    port: "9092"
    topic: rudder-cli-e2e-ssh-updated
    ssl_enabled: false
    use_sasl: false
    use_ssh: true
    ssh:
      host: bastion.rudder-cli-e2e.internal:22
      port: "22"
      user: rudder-updated
      public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5rudderE2E rudder@rudder-cli-e2e
    convert_to_avro: false
    enable_multi_topic: false
