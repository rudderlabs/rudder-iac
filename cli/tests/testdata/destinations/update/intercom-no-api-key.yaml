version: rudder/v1
kind: destination
metadata:
  name: intercom-no-api-key
spec:
  id: intercom-no-api-key
  display_name: E2E Intercom No API Key Updated
  type: intercom
  enabled: true
  definition_version: 1
  config:
    app_id: "{{ .INTERCOM_NO_API_KEY_APP_ID_UPDATED }}"
    api_server: au
    api_version: v2
    send_anonymous_id: true
    update_last_request_at: false
    mobile_api_key_android: "{{ .INTERCOM_NO_API_KEY_MOBILE_API_KEY_ANDROID_UPDATED }}"
    mobile_api_key_ios: "{{ .INTERCOM_NO_API_KEY_MOBILE_API_KEY_IOS_UPDATED }}"
