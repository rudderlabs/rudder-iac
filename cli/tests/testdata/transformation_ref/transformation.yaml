version: rudder/v1
kind: transformation
metadata:
  name: tag_source_transformation
spec:
  id: tag-source
  name: Tag Source
  description: Stamps the source name onto every event
  language: javascript
  code: |
    export function transformEvent(event, metadata) {
      event.properties = event.properties || {};
      event.properties.taggedBy = 'rudder-cli-e2e';
      return event;
    }
