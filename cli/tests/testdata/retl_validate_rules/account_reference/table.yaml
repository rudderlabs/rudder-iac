version: rudder/v1
kind: retl-source-table
metadata:
  name: e2e-validate-table
spec:
  id: e2e-validate-table
  display_name: E2E Validate Table
  # A Postgres account cannot back a Snowflake source.
  account: "#account:e2e-validate-pg"
  primary_key: id
  source_definition: snowflake
  schema: ANALYTICS
  table: USERS
  enabled: true
