version: rudder/v1
kind: retl-connections
metadata:
  name: e2e-validate-connection
spec:
  connections:
    - id: e2e-validate-connection
      source: "#retl-source-sql-model:e2e-validate-model"
      destination: "#destination:e2e-validate-http"
      enabled: true
      config:
        # mirror is object-mapping only; this is the json_mapper flow.
        sync_behaviour: mirror
        schedule:
          type: basic
          every_minutes: 30
        identifiers:
          - from: id
            to: user_id
        mappings:
          - from: email
            to: traits.email
        event:
          type: identify
