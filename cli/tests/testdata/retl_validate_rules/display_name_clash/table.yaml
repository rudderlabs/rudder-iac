version: rudder/v1
kind: retl-source-table
metadata:
  name: e2e-validate-table
spec:
  id: e2e-validate-table
  # Differs from the SQL model's display_name only in case. The control plane
  # names both source kinds from one case-insensitive namespace, so this would
  # otherwise be refused mid-apply, after the model had already been created.
  display_name: e2e validate users
  account: "#account:e2e-validate-pg"
  primary_key: id
  source_definition: postgres
  schema: analytics
  table: users
  enabled: true
