version: rudder/v1
kind: account
metadata:
  name: e2e-cimp-pg
spec:
  id: e2e-cimp-pg
  name: E2E Connection Import Postgres
  account_definition_name: SOURCE_POSTGRES
  config:
    host: db.acme-analytics.internal
    dbname: analytics
    user: rudder
    port: 5432
    sslMode: disable
    password: "{{ .PG_PASSWORD }}"
