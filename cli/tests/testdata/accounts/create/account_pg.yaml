version: rudder/v1
kind: account
metadata:
  name: prod-pg
spec:
  id: prod-pg
  name: Production Postgres
  account_definition_name: SOURCE_POSTGRES
  config:
    host: db.acme-analytics.internal
    dbname: analytics
    user: rudder
    port: "5432"
    sslMode: disable
    password: "{{ .PG_PASSWORD }}"
