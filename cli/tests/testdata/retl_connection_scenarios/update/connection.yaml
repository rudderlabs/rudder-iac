version: rudder/v1
kind: retl-connections
metadata:
  name: e2e-scn-connections
spec:
  connections:
    # basic -> cron, so a backend that kept the stale everyMinutes re-plans
    # forever and the convergence subtest says so. enabled goes false, and the
    # partial sync_settings block sets only failed_keys: its stored values are
    # non-default, so filling the rest from the CLI's defaults and merging
    # against what the server stored give different answers here.
    - id: e2e-scn-orders-track
      source: "#retl-source-sql-model:e2e-scn-model"
      destination: "#destination:e2e-scn-http-track"
      enabled: false
      config:
        sync_behaviour: upsert
        cursor_column: updated_at
        schedule:
          type: cron
          cron_expression: "30 2 * * *"
        identifiers:
          - from: id
            to: user_id
        mappings:
          - from: email
            to: properties.email
          - from: plan
            to: properties.plan
        constants:
          - key: properties.origin
            value: rudder-cli-e2e-v2
          - key: properties.team
            value: dex
        event:
          type: track
          name: Order Synced
        sync_settings:
          failed_keys:
            retry: true
    # cron -> manual, so a stale cronExpression shows up the same way, and a
    # full non-default block replaces the defaults the create step stored.
    - id: e2e-scn-customers-full
      source: "#retl-source-table:e2e-scn-table"
      destination: "#destination:e2e-scn-http-column"
      config:
        sync_behaviour: full
        schedule:
          type: manual
        identifiers:
          - from: id
            to: anonymous_id
        mappings:
          - from: email
            to: properties.email
        event:
          type: track
          name_column: event_name
        sync_settings:
          sync_logs:
            enabled: false
            retention_days: 14
            snapshots_to_retain: 3
          failed_keys:
            retry: false
