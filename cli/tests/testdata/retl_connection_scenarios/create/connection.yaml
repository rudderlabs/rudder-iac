version: rudder/v1
kind: retl-connections
metadata:
  name: e2e-scn-connections
spec:
  connections:
    # Everything the model connection sets is create-only except the schedule,
    # the enabled flag, the constants and the sync settings, which update moves.
    # retention_days and snapshots_to_retain are an explicit 0: the PRD calls it
    # a real setting, and a backend coercing it to the default is drift only a
    # live run can see.
    - id: e2e-scn-orders-track
      source: "#retl-source-sql-model:e2e-scn-model"
      destination: "#destination:e2e-scn-http-track"
      enabled: true
      config:
        sync_behaviour: upsert
        cursor_column: updated_at
        schedule:
          type: basic
          every_minutes: 30
        identifiers:
          - from: id
            to: user_id
        mappings:
          - from: email
            to: properties.email
          - from: plan
            to: properties.plan
        constants:
          - key: properties.origin
            value: rudder-cli-e2e
        event:
          type: track
          name: Order Synced
        sync_settings:
          sync_logs:
            enabled: false
            retention_days: 0
            snapshots_to_retain: 0
          failed_keys:
            retry: false
    # enabled is omitted on purpose: an omitted flag means an enabled connection.
    # manual is the schedule a create has to carry itself: there is nothing to
    # clear and nothing to poll, so a backend that invents a default interval
    # for it only shows up here. The non-default sync_settings block is what
    # update drops, and a drop has to start from something the defaults differ
    # from to be visible at all.
    - id: e2e-scn-customers-full
      source: "#retl-source-table:e2e-scn-table"
      destination: "#destination:e2e-scn-http-column"
      config:
        sync_behaviour: full
        schedule:
          type: manual
        identifiers:
          - from: id
            to: anonymous_id
        mappings:
          - from: email
            to: properties.email
        event:
          type: track
          name_column: event_name
        sync_settings:
          sync_logs:
            enabled: false
            retention_days: 14
            snapshots_to_retain: 3
          failed_keys:
            retry: false
