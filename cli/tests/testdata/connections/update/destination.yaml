version: rudder/v1
kind: destination
metadata:
  name: e2e-conn-s3
spec:
  id: e2e-conn-s3
  display_name: E2E Connection S3
  type: s3
  enabled: true
  definition_version: 1
  config:
    bucket_name: rudder-cli-e2e
    prefix: rudder/
    role_based_auth: false
    access_key_id: "{{ .S3_ACCESS_KEY_ID }}"
    access_key: "{{ .S3_ACCESS_KEY }}"
    # Declared explicitly because the backend only merges definition defaults on
    # create: the update PUT replaces config wholesale, so a key the spec omits
    # is dropped rather than retained. destinations/update/s3.yaml does the same.
    enable_sse: false
