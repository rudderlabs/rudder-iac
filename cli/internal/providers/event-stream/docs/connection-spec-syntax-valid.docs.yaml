rule_id: "event-stream/connection/spec-syntax-valid"
match_behavior:
  # event-stream-connections is a v1-only kind: connection entries need id,
  # source, and destination; the source ref must point at an event stream
  # source and the destination ref at a destination. Connection id uniqueness
  # across the project is the project/duplicate-urn rule's concern.
  - applies_to:
      - kind: "event-stream-connections"
        version: "rudder/v1"
    valid:
      - example_id: "es-connection-valid-minimal"
        title: "Valid connection linking an event stream source to a destination"
        files:
          spec.yaml: |
            version: rudder/v1
            kind: event-stream-connections
            metadata:
              name: my-connections
            spec:
              connections:
                - id: android-to-s3
                  source: "#event-stream-source:my-android-source"
                  destination: "#destination:my-s3-destination"
      - example_id: "es-connection-valid-multiple-with-enabled"
        title: "Valid connection list with an explicitly disabled entry"
        files:
          spec.yaml: |
            version: rudder/v1
            kind: event-stream-connections
            metadata:
              name: my-connections
            spec:
              connections:
                - id: android-to-s3
                  source: "#event-stream-source:my-android-source"
                  destination: "#destination:my-s3-destination"
                - id: js-to-s3
                  source: "#event-stream-source:my-js-source"
                  destination: "#destination:my-s3-destination"
                  enabled: false
    invalid:
      - example_id: "es-connection-missing-required-fields"
        title: "Connection entry missing required source and destination"
        files:
          spec.yaml: |
            version: rudder/v1
            kind: event-stream-connections
            metadata:
              name: my-connections
            spec:
              connections:
                - id: android-to-s3
        expected_diagnostics:
          - file: "spec.yaml"
            reference: "/spec/connections/0/source"
            severity: "error"
            message_contains: "'source' is required"
          - file: "spec.yaml"
            reference: "/spec/connections/0/destination"
            severity: "error"
            message_contains: "'destination' is required"
      - example_id: "es-connection-source-ref-malformed"
        title: "Connection whose source is not a reference"
        files:
          spec.yaml: |
            version: rudder/v1
            kind: event-stream-connections
            metadata:
              name: my-connections
            spec:
              connections:
                - id: android-to-s3
                  source: "my-android-source"
                  destination: "#destination:my-s3-destination"
        expected_diagnostics:
          - file: "spec.yaml"
            reference: "/spec/connections/0/source"
            severity: "error"
            message_contains: "'source' is invalid: must be of pattern #event-stream-source:<id>"
      - example_id: "es-connection-source-ref-wrong-family"
        title: "Connection whose source ref points at a rETL source kind"
        files:
          spec.yaml: |
            version: rudder/v1
            kind: event-stream-connections
            metadata:
              name: my-connections
            spec:
              connections:
                - id: model-to-s3
                  source: "#retl-source-sql-model:my-model"
                  destination: "#destination:my-s3-destination"
        expected_diagnostics:
          - file: "spec.yaml"
            reference: "/spec/connections/0/source"
            severity: "error"
            message_contains: "'source' must reference an event stream source (#event-stream-source:<id>), got a 'retl-source-sql-model' reference"
      - example_id: "es-connection-destination-ref-wrong-kind"
        title: "Connection whose destination ref points at a source"
        files:
          spec.yaml: |
            version: rudder/v1
            kind: event-stream-connections
            metadata:
              name: my-connections
            spec:
              connections:
                - id: android-to-s3
                  source: "#event-stream-source:my-android-source"
                  destination: "#event-stream-source:my-js-source"
        expected_diagnostics:
          - file: "spec.yaml"
            reference: "/spec/connections/0/destination"
            severity: "error"
            message_contains: "'destination' must reference a destination (#destination:<id>), got a 'event-stream-source' reference"
