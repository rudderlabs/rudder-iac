rule_id: "retl/connection/enabled-endpoints-valid"
match_behavior:
  # V-C7: the API accepts an enabled connection whose source or destination is
  # disabled, and the connection then never syncs. enabled defaults to true when
  # omitted. A disabled connection is skipped, and endpoints missing from the
  # project belong to retl/connection/semantic-valid.
  - applies_to:
      - kind: "retl-connections"
        version: "rudder/v1"
    valid:
      - example_id: "retl-connection-enabled-endpoints-all-enabled"
        title: "Enabled connection between two enabled endpoints"
        files:
          model.yaml: &enabled-model |
            version: rudder/v1
            kind: retl-source-sql-model
            metadata:
              name: users-model
            spec:
              id: users-model
              display_name: Users
              account_id: acc-123
              primary_key: user_id
              source_definition: postgres
              sql: SELECT user_id, email FROM users
          destination.yaml: &http-destination |
            version: rudder/v1
            kind: destination
            metadata:
              name: my-http-destination
            spec:
              id: my-http-destination
              display_name: Events Webhook
              type: http
              enabled: true
              definition_version: 1
              config:
                api_url: "https://example.com/events"
                auth: noAuth
                method: POST
                format: JSON
                connection_mode:
                  warehouse: cloud
          connections.yaml: &enabled-connection |
            version: rudder/v1
            kind: retl-connections
            metadata:
              name: retl-connections
            spec:
              connections:
                - id: users-to-webhook
                  source: "#retl-source-sql-model:users-model"
                  destination: "#destination:my-http-destination"
                  config:
                    sync_behaviour: upsert
                    schedule:
                      type: manual
                    identifiers:
                      - from: user_id
                        to: user_id
                    mappings:
                      - from: email
                        to: traits.email
      - example_id: "retl-connection-enabled-endpoints-disabled-connection"
        title: "Disabled connection may point at a disabled source"
        files:
          model.yaml: &disabled-model |
            version: rudder/v1
            kind: retl-source-sql-model
            metadata:
              name: users-model
            spec:
              id: users-model
              display_name: Users
              account_id: acc-123
              primary_key: user_id
              source_definition: postgres
              sql: SELECT user_id, email FROM users
              enabled: false
          destination.yaml: *http-destination
          connections.yaml: |
            version: rudder/v1
            kind: retl-connections
            metadata:
              name: retl-connections
            spec:
              connections:
                - id: users-to-webhook
                  source: "#retl-source-sql-model:users-model"
                  destination: "#destination:my-http-destination"
                  enabled: false
                  config:
                    sync_behaviour: upsert
                    schedule:
                      type: manual
                    identifiers:
                      - from: user_id
                        to: user_id
                    mappings:
                      - from: email
                        to: traits.email
    invalid:
      - example_id: "retl-connection-enabled-endpoints-disabled-source"
        title: "Enabled connection whose SQL model source is disabled"
        files:
          model.yaml: *disabled-model
          destination.yaml: *http-destination
          connections.yaml: *enabled-connection
        expected_diagnostics:
          - file: "connections.yaml"
            reference: "/spec/connections/0/source"
            severity: "warning"
            message_contains: "connection 'users-to-webhook' is enabled but its source 'users-model' is disabled"
      - example_id: "retl-connection-enabled-endpoints-disabled-destination"
        title: "Connection with enabled omitted whose destination is disabled"
        files:
          model.yaml: *enabled-model
          destination.yaml: |
            version: rudder/v1
            kind: destination
            metadata:
              name: my-http-destination
            spec:
              id: my-http-destination
              display_name: Events Webhook
              type: http
              enabled: false
              definition_version: 1
              config:
                api_url: "https://example.com/events"
                auth: noAuth
                method: POST
                format: JSON
                connection_mode:
                  warehouse: cloud
          connections.yaml: *enabled-connection
        expected_diagnostics:
          - file: "connections.yaml"
            reference: "/spec/connections/0/destination"
            severity: "warning"
            message_contains: "connection 'users-to-webhook' is enabled but its destination 'my-http-destination' is disabled"
