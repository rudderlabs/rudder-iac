rule_id: "retl/connection/inherited-fan-in"
match_behavior:
  # An offline warning only when every rETL connection reaching the same
  # destination declares its own nonempty, distinct remote connection import ID
  # in the active workspace (inline import metadata or central import-manifest).
  # Missing, wrong-workspace or duplicate IDs do not inherit fan-in. This is not
  # permission to add a source to the group: CheckPlan reads the entire remote
  # workspace, including unmanaged connections, before apply. A replacement
  # that does not introduce fan-in and whose target pair is unoccupied is allowed.
  - applies_to:
      - kind: "retl-connections"
        version: "rudder/v1"
    valid:
      - example_id: "retl-inherited-fan-in-single-source"
        title: "One connection per destination"
        files:
          model.yaml: |
            version: rudder/v1
            kind: retl-source-sql-model
            metadata:
              name: users-model
            spec:
              id: users-model
              display_name: Users
              account_id: acc-123
              primary_key: user_id
              source_definition: postgres
              sql: SELECT user_id FROM users
          destination.yaml: |
            version: rudder/v1
            kind: destination
            metadata:
              name: my-http-destination
            spec:
              id: my-http-destination
              display_name: Webhook
              type: http
              enabled: true
              definition_version: 1
              config:
                api_url: "https://example.com/events"
                auth: noAuth
                method: POST
                format: JSON
                connection_mode:
                  warehouse: cloud
          connections.yaml: |
            version: rudder/v1
            kind: retl-connections
            metadata:
              name: retl-connections
            spec:
              connections:
                - id: users-to-webhook
                  source: "#retl-source-sql-model:users-model"
                  destination: "#destination:my-http-destination"
                  config:
                    sync_behaviour: upsert
                    schedule:
                      type: basic
                      every_minutes: 30
                    identifiers:
                      - from: user_id
                        to: user_id
                    mappings:
                      - from: user_id
                        to: traits.user_id
    invalid:
      - example_id: "retl-inherited-fan-in-warning"
        title: "Existing imported connections from two rETL sources"
        description: "Both distinct connection IDs are declared for one workspace. Offline validation warns; plan preflight still verifies the remote endpoints before any write."
        files:
          model.yaml: |
            version: rudder/v1
            kind: retl-source-sql-model
            metadata:
              name: users-model
            spec:
              id: users-model
              display_name: Users
              account_id: acc-123
              primary_key: user_id
              source_definition: postgres
              sql: SELECT user_id FROM users
          other-model.yaml: |
            version: rudder/v1
            kind: retl-source-sql-model
            metadata:
              name: orders-model
            spec:
              id: orders-model
              display_name: Orders
              account_id: acc-123
              primary_key: user_id
              source_definition: postgres
              sql: SELECT user_id FROM orders
          destination.yaml: |
            version: rudder/v1
            kind: destination
            metadata:
              name: my-http-destination
            spec:
              id: my-http-destination
              display_name: Webhook
              type: http
              enabled: true
              definition_version: 1
              config:
                api_url: "https://example.com/events"
                auth: noAuth
                method: POST
                format: JSON
          connections.yaml: |
            version: rudder/v1
            kind: retl-connections
            metadata:
              name: retl-connections
              import:
                workspaces:
                  - workspace_id: ws-1
                    resources:
                      - urn: retl-connection:users-to-webhook
                        remote_id: remote-users-connection
                      - urn: retl-connection:orders-to-webhook
                        remote_id: remote-orders-connection
            spec:
              connections:
                - id: users-to-webhook
                  source: "#retl-source-sql-model:users-model"
                  destination: "#destination:my-http-destination"
                  config:
                    sync_behaviour: upsert
                    schedule:
                      type: manual
                    identifiers:
                      - from: user_id
                        to: user_id
                    mappings:
                      - from: user_id
                        to: traits.user_id
                - id: orders-to-webhook
                  source: "#retl-source-sql-model:orders-model"
                  destination: "#destination:my-http-destination"
                  config:
                    sync_behaviour: upsert
                    schedule:
                      type: manual
                    identifiers:
                      - from: user_id
                        to: user_id
                    mappings:
                      - from: user_id
                        to: traits.user_id
        expected_diagnostics:
          - file: "connections.yaml"
            reference: "/spec/connections/0/destination"
            severity: "warning"
            message_contains: "each importing a distinct connection in the active workspace; this inherited fan-in may be retained"
          - file: "connections.yaml"
            reference: "/spec/connections/1/destination"
            severity: "warning"
            message_contains: "each importing a distinct connection in the active workspace; this inherited fan-in may be retained"
