rule_id: "retl/connection/cron-expression-valid"
match_behavior:
  # Warns only where local analysis could not reach a verdict: a cron dialect
  # this CLI does not parse (Quartz extensions, six or seven fields, a timezone
  # prefix) or an analysis that stopped short. The backend stores cron
  # expressions verbatim and never parses them, so it accepts these and the
  # apply is not blocked. An expression that is definitely invalid or that
  # breaks the five-minute floor is an error from
  # retl/connection/spec-syntax-valid instead, never downgraded to a warning.
  # The analysis is exact today, so no expression is reported as inconclusive.
  - applies_to:
      - kind: "retl-connections"
        version: "rudder/v1"
    valid:
      - example_id: "retl-connection-cron-supported-expression"
        title: "Cron expression the CLI can check locally"
        files:
          model.yaml: &users-model |
            version: rudder/v1
            kind: retl-source-sql-model
            metadata:
              name: users-model
            spec:
              id: users-model
              display_name: Users
              account_id: acc-123
              primary_key: user_id
              source_definition: postgres
              sql: SELECT user_id, email FROM users
          destination.yaml: &http-destination |
            version: rudder/v1
            kind: destination
            metadata:
              name: my-http-destination
            spec:
              id: my-http-destination
              display_name: Events Webhook
              type: http
              enabled: true
              definition_version: 1
              config:
                api_url: "https://example.com/events"
                auth: noAuth
                method: POST
                format: JSON
                connection_mode:
                  warehouse: cloud
          connections.yaml: |
            version: rudder/v1
            kind: retl-connections
            metadata:
              name: retl-connections
            spec:
              connections:
                - id: users-to-webhook
                  source: "#retl-source-sql-model:users-model"
                  destination: "#destination:my-http-destination"
                  config:
                    sync_behaviour: upsert
                    schedule:
                      type: cron
                      cron_expression: "0 */2 * * *"
                    identifiers:
                      - from: user_id
                        to: user_id
                    mappings:
                      - from: email
                        to: traits.email
    invalid:
      - example_id: "retl-connection-cron-unsupported-dialect"
        title: "Quartz 'L' extension the CLI cannot analyse"
        description: "The backend accepts the expression unparsed, so this is a warning: only the author can confirm the schedule it produces."
        files:
          model.yaml: *users-model
          destination.yaml: *http-destination
          connections.yaml: |
            version: rudder/v1
            kind: retl-connections
            metadata:
              name: retl-connections
            spec:
              connections:
                - id: users-to-webhook
                  source: "#retl-source-sql-model:users-model"
                  destination: "#destination:my-http-destination"
                  config:
                    sync_behaviour: upsert
                    schedule:
                      type: cron
                      cron_expression: "0 0 L * *"
                    identifiers:
                      - from: user_id
                        to: user_id
                    mappings:
                      - from: email
                        to: traits.email
        expected_diagnostics:
          - file: "connections.yaml"
            reference: "/spec/connections/0/config/schedule/cron_expression"
            severity: "warning"
            message_contains: "'cron_expression' could not be checked locally"
