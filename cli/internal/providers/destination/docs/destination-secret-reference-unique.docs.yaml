rule_id: "destination/secret-reference-unique"
match_behavior:
  - applies_to:
      - kind: "destination"
        version: "rudder/v1"
    valid:
      - example_id: "destination-secret-reference-unique-distinct"
        title: "Each secret key references its own variable"
        files:
          braze.yaml: |
            version: rudder/v1
            kind: destination
            metadata:
              name: shop
            spec:
              id: shop
              display_name: Shop Braze
              type: braze
              definition_version: 1
              enabled: true
              config:
                data_center: US-01
                android_api_key: '{{ .SHOP_ANDROID_API_KEY }}'
          amplitude.yaml: |
            version: rudder/v1
            kind: destination
            metadata:
              name: shop-amplitude
            spec:
              id: shop-amplitude
              display_name: Shop Amplitude
              type: am
              definition_version: 1
              enabled: true
              config:
                api_key: '{{ .SHOP_AMPLITUDE_API_KEY }}'
                residency_server: standard
    invalid:
      - example_id: "destination-secret-reference-unique-collision"
        title: "Two secret keys reference the same variable"
        description: |
          Import names a variable after the spec id and the key, joined by
          underscores. Braze `shop` with `android_api_key` and Amplitude
          `shop-android` with `api_key` both get SHOP_ANDROID_API_KEY, so one
          value would reach both destinations. Each location is reported and
          names the other.
        files:
          braze.yaml: |
            version: rudder/v1
            kind: destination
            metadata:
              name: shop
            spec:
              id: shop
              display_name: Shop Braze
              type: braze
              definition_version: 1
              enabled: true
              config:
                data_center: US-01
                android_api_key: '{{ .SHOP_ANDROID_API_KEY }}'
          amplitude.yaml: |
            version: rudder/v1
            kind: destination
            metadata:
              name: shop-android
            spec:
              id: shop-android
              display_name: Shop Android Amplitude
              type: am
              definition_version: 1
              enabled: true
              config:
                api_key: '{{ .SHOP_ANDROID_API_KEY }}'
                residency_server: standard
        expected_diagnostics:
          - file: "braze.yaml"
            reference: "/spec/config/android_api_key"
            severity: "warning"
            message_contains: "shares variable SHOP_ANDROID_API_KEY with secret key \"api_key\" of destination \"shop-android\""
          - file: "amplitude.yaml"
            reference: "/spec/config/api_key"
            severity: "warning"
            message_contains: "shares variable SHOP_ANDROID_API_KEY with secret key \"android_api_key\" of destination \"shop\""
