rule_id: "destination/secret-reference"
match_behavior:
  - applies_to:
      - kind: "destination"
        version: "rudder/v1"
    valid:
      - example_id: "destination-secret-reference-variable"
        title: "Each secret key holds one variable reference"
        description: |
          The check runs on the spec as written, before variable substitution,
          so it passes whether or not the variables are defined yet. Quotes
          around the reference are fine; import writes single quotes.
        files:
          amplitude.yaml: |
            version: rudder/v1
            kind: destination
            metadata:
              name: shop-amplitude
            spec:
              id: shop-amplitude
              display_name: Shop Amplitude
              type: am
              definition_version: 1
              enabled: true
              config:
                api_key: '{{ .SHOP_AMPLITUDE_API_KEY }}'
                residency_server: standard
          webhook.yaml: |
            version: rudder/v1
            kind: destination
            metadata:
              name: shop-webhook
            spec:
              id: shop-webhook
              display_name: Shop Webhook
              type: webhook
              definition_version: 1
              enabled: true
              config:
                webhook_url: https://example.com/hook
                headers:
                  - from: Authorization
                    to: '{{ .SHOP_WEBHOOK_HEADERS_0_TO }}'
      - example_id: "destination-secret-reference-event-value"
        title: "A secret key reads its value from each event"
        description: |
          A JSONPath in a key that reads one, such as http's headers.from,
          or a template whose fallback is empty, makes the destination read
          the value from each event, so it holds no secret. A JSONPath in
          any other secret key is a literal value and is reported, and so is
          a template with a fallback, since the fallback is a value written
          in the spec.
        files:
          http.yaml: |
            version: rudder/v1
            kind: destination
            metadata:
              name: shop-http
            spec:
              id: shop-http
              display_name: Shop HTTP
              type: http
              definition_version: 1
              enabled: true
              config:
                api_url: https://example.com/events
                auth: noAuth
                method: POST
                format: JSON
                headers:
                  - to: X-Request-Id
                    from: $.messageId
          webhook.yaml: |
            version: rudder/v1
            kind: destination
            metadata:
              name: shop-webhook
            spec:
              id: shop-webhook
              display_name: Shop Webhook
              type: webhook
              definition_version: 1
              enabled: true
              config:
                webhook_url: https://example.com/hook
                headers:
                  - from: Authorization
                    to: '{{ message.context.authToken || "" }}'
    invalid:
      - example_id: "destination-secret-reference-literal"
        title: "A secret key holds a literal value"
        description: |
          The warning names the variable import would use for the key. The
          value itself is never printed.
        files:
          amplitude.yaml: |
            version: rudder/v1
            kind: destination
            metadata:
              name: shop-amplitude
            spec:
              id: shop-amplitude
              display_name: Shop Amplitude
              type: am
              definition_version: 1
              enabled: true
              config:
                api_key: fake-amplitude-api-key
                residency_server: standard
        expected_diagnostics:
          - file: "amplitude.yaml"
            reference: "/spec/config/api_key"
            severity: "warning"
            message_contains: "such as '{{ .SHOP_AMPLITUDE_API_KEY }}'"
      - example_id: "destination-secret-reference-default"
        title: "A secret key's reference carries a default"
        description: |
          Substitution uses the default when the variable is undefined, so the
          default is a secret written in the spec. The warning asks only for
          the default to go, since the reference already names a variable.
        files:
          amplitude.yaml: |
            version: rudder/v1
            kind: destination
            metadata:
              name: shop-amplitude
            spec:
              id: shop-amplitude
              display_name: Shop Amplitude
              type: am
              definition_version: 1
              enabled: true
              config:
                api_key: '{{ .SHOP_AMPLITUDE_API_KEY | fake-amplitude-api-key }}'
                residency_server: standard
        expected_diagnostics:
          - file: "amplitude.yaml"
            reference: "/spec/config/api_key"
            severity: "warning"
            message_contains: "remove the default from the reference to SHOP_AMPLITUDE_API_KEY"
      - example_id: "destination-secret-reference-list-literal"
        title: "A secret key inside a list holds a literal value"
        description: |
          A secret key under a list applies to every member, and each member
          gets its own variable, numbered by its position.
        files:
          webhook.yaml: |
            version: rudder/v1
            kind: destination
            metadata:
              name: shop-webhook
            spec:
              id: shop-webhook
              display_name: Shop Webhook
              type: webhook
              definition_version: 1
              enabled: true
              config:
                webhook_url: https://example.com/hook
                headers:
                  - from: Authorization
                    to: Bearer fake-webhook-token
        expected_diagnostics:
          - file: "webhook.yaml"
            reference: "/spec/config/headers/0/to"
            severity: "warning"
            message_contains: "such as '{{ .SHOP_WEBHOOK_HEADERS_0_TO }}'"
