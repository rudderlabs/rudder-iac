rule_id: "accounts/spec-syntax-valid"
match_behavior:
  - applies_to:
      - kind: "account"
        version: "rudder/v1"
    valid:
      - example_id: "account-v1-snowflake-key-pair-valid"
        title: "Valid Snowflake key-pair account"
        files:
          spec.yaml: |
            version: rudder/v1
            kind: account
            metadata:
              name: snf
            spec:
              id: snf
              name: Snowflake
              account_definition_name: SOURCE_SNOWFLAKE
              config:
                account: xy12345.us-east-1
                dbname: ANALYTICS
                warehouse: COMPUTE_WH
                user: RUDDER
                authenticationType: keyPair
                privateKey: "{{ .SNF_PRIVATEKEY }}"
      - example_id: "account-v1-databricks-pat-valid"
        title: "Valid Databricks personal-access-token account"
        files:
          spec.yaml: |
            version: rudder/v1
            kind: account
            metadata:
              name: dbx
            spec:
              id: dbx
              name: Databricks
              account_definition_name: SOURCE_DATABRICKS
              config:
                host: dbc-00000000-0000.cloud.databricks.com
                port: 443
                path: /sql/1.0/warehouses/abc123
                authenticationType: pat
                token: "{{ .DBX_TOKEN }}"
      - example_id: "account-v1-oauth-no-config"
        title: "OAuth account, adopted from the dashboard"
        files:
          spec.yaml: |
            version: rudder/v1
            kind: account
            metadata:
              name: google-ads-prod
            spec:
              id: google-ads-prod
              name: Google Ads (prod)
              account_definition_name: DESTINATION_GOOGLE_ADWORDS_OFFLINE_CONVERSIONS_OAUTH
    invalid:
      - example_id: "account-v1-oauth-with-config"
        title: "OAuth account with a config block"
        files:
          spec.yaml: |
            version: rudder/v1
            kind: account
            metadata:
              name: google-ads-prod
            spec:
              id: google-ads-prod
              name: Google Ads (prod)
              account_definition_name: DESTINATION_GOOGLE_ADWORDS_OFFLINE_CONVERSIONS_OAUTH
              config:
                customerId: "123-456-7890"
        expected_diagnostics:
          - file: "spec.yaml"
            reference: "/config"
            severity: "error"
            message_contains: "'config' is not allowed"
      - example_id: "account-v1-missing-id"
        title: "Account spec without an id"
        files:
          spec.yaml: |
            version: rudder/v1
            kind: account
            metadata:
              name: snf
            spec:
              name: Snowflake
              account_definition_name: SOURCE_POSTGRES
              config:
                host: db.example.com
                dbname: app
                user: rudder
                port: 5432
                sslMode: require
                password: "{{ .PG_PASSWORD }}"
        expected_diagnostics:
          - file: "spec.yaml"
            reference: "/id"
            severity: "error"
            message_contains: "'id' is required"
      - example_id: "account-v1-missing-required-config"
        title: "Postgres account without its host"
        files:
          spec.yaml: |
            version: rudder/v1
            kind: account
            metadata:
              name: pg
            spec:
              id: pg
              name: Postgres
              account_definition_name: SOURCE_POSTGRES
              config:
                dbname: app
                user: rudder
                port: 5432
                sslMode: require
                password: "{{ .PG_PASSWORD }}"
        expected_diagnostics:
          - file: "spec.yaml"
            reference: "/config/host"
            severity: "error"
            message_contains: "'host' is required for SOURCE_POSTGRES accounts"
