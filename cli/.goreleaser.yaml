# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: rudder-cli

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    - go generate ./...
    # Regenerate the validation rule catalog against the tag being released, so
    # the published artifact's cli_version matches the binaries shipped beside
    # it — that is what lets a consumer fetch the catalog for the version they
    # actually run. Deliberately generated with experimental flags off: the
    # release artifact should describe what a default install enforces. The
    # gen-rule-docs CI gate runs with them on, because its job is the opposite —
    # proving every rule has authored docs.
    - go run -ldflags "-X main.version={{ .Version }}" ./cli/cmd/gen-rule-docs --output-dir ./docs/generated/

builds:
  - env:
      - CGO_ENABLED=0
    main: ./cli/cmd/rudder-cli/main.go
    goos:
      - linux
      - windows
      - darwin
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X github.com/rudderlabs/rudder-iac/cli/internal/config.TelemetryWriteKey={{ .Env.TELEMETRY_WRITE_KEY }}
      - -X github.com/rudderlabs/rudder-iac/cli/internal/config.TelemetryDataplaneURL={{ .Env.TELEMETRY_DATAPLANE_URL }}

archives:
  - formats: [ 'tar.gz' ]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [ 'zip' ]

release:
  # Ship the rule catalog alongside the binaries. It is the authoritative
  # reference for the rule IDs `rudder-cli validate` reports, and the densest
  # artifact we have for teaching a tool — or an agent — our spec dialect.
  # Attaching it here means consumers pin a version instead of scraping the
  # artifact off a CI run.
  extra_files:
    - glob: ./docs/generated/rules.yaml

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
