name: rudder-cli auth
synopsis: Authentication commands
description: |
    Authenticate the CLI with RudderStack. Credentials are stored in the configured local CLI configuration and used by commands that access a workspace.
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for auth
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    rudder-cli auth --help
see_also:
    - rudder-cli - Manage RudderStack resources as code
    - rudder-cli auth login - Login with an access token
