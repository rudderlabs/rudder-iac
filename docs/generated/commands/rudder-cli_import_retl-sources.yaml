name: rudder-cli import retl-sources
synopsis: Import remote RETL SQL Model to local configuration
description: |
    Import a remote RETL SQL Model source into a local YAML configuration file.
    This command fetches the remote SQL Model using the provided remote ID,
    creates a local YAML configuration with the specified local ID, and embeds
    import metadata for tracking.

    Optionally, you can specify a separate location for SQL files using --sql-location.
    When provided, the SQL content will be saved as a separate .sql file and the
    YAML configuration will reference it using the 'file' field instead of inline 'sql'.
usage: rudder-cli import retl-sources [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for retl-sources
    - name: local-id
      shorthand: i
      usage: Local identifier for the imported SQL Model (required)
    - name: location
      shorthand: l
      default_value: .
      usage: |
        Directory where to save the YAML configuration file (default: current directory)
    - name: remote-id
      shorthand: r
      usage: Remote RETL source ID to import (required)
    - name: sql-location
      shorthand: s
      usage: |
        Directory where to save SQL files separately (optional, if not provided SQL will be inline in YAML)
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    $ rudder-cli import retl-sources --local-id my-model --remote-id abc123
    $ rudder-cli import retl-sources -i analytics-model -r def789 -l ./models
    $ rudder-cli import retl-sources --local-id analytics-model --remote-id def789 --location ./models --sql-location ./sql
    $ rudder-cli import retl-sources -i analytics-model -r def789 -l ./models -s ./sql
see_also:
    - rudder-cli import - Import remote resources to local configuration
