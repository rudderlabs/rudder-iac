name: rudder-cli experimental
synopsis: Manage experimental features
description: |
    List and manage opt-in experimental feature flags. Experimental commands require experimental mode during normal CLI execution.
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for experimental
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    RUDDERSTACK_CLI_EXPERIMENTAL=true rudder-cli experimental list
see_also:
    - rudder-cli - Manage RudderStack resources as code
    - rudder-cli experimental disable - Disable an experimental flag
    - rudder-cli experimental enable - Enable an experimental flag
    - rudder-cli experimental list - List all available experimental flags
    - rudder-cli experimental reset - Reset all experimental flags to their defaults
