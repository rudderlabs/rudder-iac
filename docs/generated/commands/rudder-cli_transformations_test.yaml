name: rudder-cli transformations test
synopsis: Test transformations
description: |
    Tests transformations by executing their code against test input events.

    You can test a single transformation by ID, all transformations, or only
    modified transformations. Test results show pass/fail status with optional
    verbose output showing diffs for failures.
usage: rudder-cli transformations test [id] [flags]
options:
    - name: all
      default_value: "false"
      usage: Test all transformations in the project
    - name: force
      default_value: "false"
      usage: Overwrite output file if it already exists
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for test
    - name: location
      shorthand: l
      default_value: .
      usage: |
        Path to the directory containing the project files or a specific file
    - name: modified
      default_value: "false"
      usage: Test only new or modified transformations
    - name: output
      shorthand: o
      usage: |
        Path to write test results JSON file (default: test-results.json)
    - name: verbose
      default_value: "false"
      usage: Show detailed output including diffs for failures
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    # Test a single transformation
    $ rudder-cli transformations test my-transformation-id

    # Test all transformations
    $ rudder-cli transformations test --all

    # Test only modified transformations
    $ rudder-cli transformations test --modified

    # Test with verbose output (shows diffs)
    $ rudder-cli transformations test --all --verbose

    # Test from a specific project directory
    $ rudder-cli transformations test --all -l ./my-project

    # Write results to a custom file path
    $ rudder-cli transformations test --all -o /tmp/results.json

    # Overwrite an existing results file
    $ rudder-cli transformations test --all --force
see_also:
    - rudder-cli transformations - Manage transformations
