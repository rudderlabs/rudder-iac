name: rudder-cli workspace accounts
synopsis: Manage accounts in the workspace
description: |
    Inspect source and destination accounts available in the authenticated workspace.
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for accounts
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    rudder-cli workspace accounts list --json
see_also:
    - rudder-cli workspace - Manage workspace resources
    - rudder-cli workspace accounts list - List accounts in the workspace
