name: rudder-cli experimental list
synopsis: List all available experimental flags
description: |
    List every available experimental feature flag, its status, and its environment variable.
usage: rudder-cli experimental list [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for list
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    RUDDERSTACK_CLI_EXPERIMENTAL=true rudder-cli experimental list
see_also:
    - rudder-cli experimental - Manage experimental features
