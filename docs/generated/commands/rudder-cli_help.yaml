name: rudder-cli help
synopsis: Help about any command
description: |
    Show detailed help for rudder-cli or one of its subcommands.

    Use this command when you need command syntax, available flags, examples, or
    the list of child commands from the installed CLI. Passing a command path shows
    help for that command; omitting it shows the root command help.
usage: rudder-cli help [command] [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for help
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    rudder-cli help
    rudder-cli help apply
    rudder-cli help workspace tracking-plans list
see_also:
    - rudder-cli - Manage RudderStack resources as code
