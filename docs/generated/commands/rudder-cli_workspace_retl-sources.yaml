name: rudder-cli workspace retl-sources
synopsis: Manage RETL sources in the workspace
description: |
    Inspect reverse ETL sources available in the authenticated workspace.
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for retl-sources
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    rudder-cli workspace retl-sources list --json
see_also:
    - rudder-cli workspace - Manage workspace resources
    - rudder-cli workspace retl-sources list - List RETL sources in the workspace
