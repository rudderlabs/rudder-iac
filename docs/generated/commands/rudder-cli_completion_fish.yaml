name: rudder-cli completion fish
synopsis: Generate the autocompletion script for fish
description: |
    Generate the autocompletion script for the fish shell.

    The generated script can be sourced for the current session or written to the
    fish completions directory so new shells load rudder-cli completions
    automatically.
usage: rudder-cli completion fish [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for fish
    - name: no-descriptions
      default_value: "false"
      usage: disable completion descriptions
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    # Load completions for the current shell
    rudder-cli completion fish | source

    # Install completions for future fish shells
    rudder-cli completion fish > ~/.config/fish/completions/rudder-cli.fish
see_also:
    - rudder-cli completion - Generate shell completion scripts
