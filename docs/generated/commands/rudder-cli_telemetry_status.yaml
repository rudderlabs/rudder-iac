name: rudder-cli telemetry status
synopsis: Show current telemetry status
description: |
    Display whether telemetry collection is currently enabled or disabled.
usage: rudder-cli telemetry status [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for status
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    rudder-cli telemetry status
see_also:
    - rudder-cli telemetry - Manage telemetry settings
