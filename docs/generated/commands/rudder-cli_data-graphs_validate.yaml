name: rudder-cli data-graphs validate
synopsis: Validate data graph resources
description: |
    Validates data graph resources (models and relationships) against the warehouse.

    Checks include table existence, column existence, type compatibility, and more.
    You can validate all resources, only modified ones, or a specific resource by type and ID.
usage: rudder-cli data-graphs validate [type] [id] [flags]
options:
    - name: all
      default_value: "false"
      usage: Validate all data graph resources in the project
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for validate
    - name: json
      shorthand: j
      default_value: "false"
      usage: Output results as JSON
    - name: location
      shorthand: l
      default_value: .
      usage: |
        Path to the directory containing the project files or a specific file
    - name: modified
      default_value: "false"
      usage: Validate only new or modified data graph resources
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    # Validate all resources
    $ rudder-cli data-graphs validate --all

    # Validate only modified resources
    $ rudder-cli data-graphs validate --modified

    # Validate a specific model
    $ rudder-cli data-graphs validate model my-model-id

    # Validate a specific relationship
    $ rudder-cli data-graphs validate relationship my-relationship-id

    # Output as JSON
    $ rudder-cli data-graphs validate --all --json
see_also:
    - rudder-cli data-graphs - Manage data graphs
