name: rudder-cli retl-sources validate
synopsis: Validate a RETL source's spec (SQL model or table)
description: |
    Validate a RETL source's spec.

    This checks the project's specs and that the source is defined in it. It
    does not run the source's query: reading from the warehouse is what
    `rudder-cli retl-sources preview` is for, and it is opt-in because it
    executes a query against live data.
usage: rudder-cli retl-sources validate <external-id> [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for validate
    - name: location
      shorthand: l
      default_value: .
      usage: Path to the project directory
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    $ rudder-cli retl-sources validate my-model
    $ rudder-cli retl-sources validate my-model --location ./project
see_also:
    - rudder-cli retl-sources - Manage RETL sources
