name: rudder-cli completion
synopsis: Generate shell completion scripts
description: |
    Generate shell completion scripts for rudder-cli.

    Use this command to install tab completion for a supported shell. Each shell
    subcommand prints the script to standard output so you can source it for the
    current session or redirect it to the location your shell loads at startup.
usage: rudder-cli completion <bash|fish|powershell|zsh> [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for completion
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    # Load bash completions for the current shell
    source <(rudder-cli completion bash)

    # Install zsh completions for future shells
    rudder-cli completion zsh > "${fpath[1]}/_rudder-cli"
see_also:
    - rudder-cli - Manage RudderStack resources as code
    - rudder-cli completion bash - Generate the autocompletion script for bash
    - rudder-cli completion fish - Generate the autocompletion script for fish
    - rudder-cli completion powershell - Generate the autocompletion script for powershell
    - rudder-cli completion zsh - Generate the autocompletion script for zsh
