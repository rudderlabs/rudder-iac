name: rudder-cli transformations show-default-events
synopsis: Show default test events
description: |
    Displays the built-in default test events that are used when testing
    transformations without custom test inputs.

    These default events cover common RudderStack event types (track, identify,
    page, screen, group, alias) and can be used as a reference when creating
    custom test inputs for your transformations.
usage: rudder-cli transformations show-default-events [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for show-default-events
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    # Show all default test events
    $ rudder-cli transformations show-default-events
see_also:
    - rudder-cli transformations - Manage transformations
