name: rudder-cli import
synopsis: Import remote resources to local configuration
description: |
    Export supported resources from the authenticated workspace into local declarative YAML project files.
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for import
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    rudder-cli import workspace --location ./project
see_also:
    - rudder-cli - Manage RudderStack resources as code
    - rudder-cli import retl-sources - Import remote RETL SQL Model to local configuration
    - rudder-cli import workspace - Import workspace resources
