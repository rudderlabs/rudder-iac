name: rudder-cli workspace accounts list
synopsis: List accounts in the workspace
description: |
    List workspace accounts, optionally filtering by category or account type and emitting JSON.
usage: rudder-cli workspace accounts list [flags]
options:
    - name: category
      usage: Filter by account category
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for list
    - name: json
      default_value: "false"
      usage: Output as JSON
    - name: type
      usage: Filter by account type
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    rudder-cli workspace accounts list
    rudder-cli workspace accounts list --category source --json
see_also:
    - rudder-cli workspace accounts - Manage accounts in the workspace
