name: rudder-cli telemetry enable
synopsis: Enable telemetry
description: |
    Enable anonymous CLI telemetry collection in the local configuration.
usage: rudder-cli telemetry enable [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for enable
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    rudder-cli telemetry enable
see_also:
    - rudder-cli telemetry - Manage telemetry settings
