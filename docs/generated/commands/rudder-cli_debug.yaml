name: rudder-cli debug
synopsis: Debug commands
description: |
    Inspect local CLI diagnostic information. Debug commands require debug mode during normal CLI execution.
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for debug
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    RUDDERSTACK_CLI_DEBUG=true rudder-cli debug config
see_also:
    - rudder-cli - Manage RudderStack resources as code
    - rudder-cli debug config - Dump the active configuration
    - rudder-cli debug config-file - Print the path to the active configuration file
    - rudder-cli debug stacktrace - Display the last panic stacktrace from the log file
