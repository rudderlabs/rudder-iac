name: rudder-cli typer options
synopsis: Show available options for a platform
description: |
    List platform-specific code generation options and their default values.
usage: rudder-cli typer options [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for options
    - name: platform
      usage: Platform to show options for (kotlin, swift, typescript)
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    rudder-cli typer options --platform kotlin
see_also:
    - rudder-cli typer - Generate type-safe tracking code
