name: rudder-cli completion powershell
synopsis: Generate the autocompletion script for powershell
description: |
    Generate the autocompletion script for PowerShell.

    The generated script can be evaluated for the current session or added to your
    PowerShell profile so new sessions load rudder-cli completions automatically.
usage: rudder-cli completion powershell [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for powershell
    - name: no-descriptions
      default_value: "false"
      usage: disable completion descriptions
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    # Load completions for the current shell
    rudder-cli completion powershell | Out-String | Invoke-Expression
see_also:
    - rudder-cli completion - Generate shell completion scripts
