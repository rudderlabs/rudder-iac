name: rudder-cli validate
synopsis: Validate project configuration
description: |
    Validates the project configuration files for correctness and consistency.
    This includes checking for valid syntax, required fields, and relationships
    between resources.
usage: rudder-cli validate [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for validate
    - name: location
      shorthand: l
      default_value: .
      usage: |
        Path to the directory containing the project files or a specific file
    - name: var-file
      default_value: '[]'
      usage: |
        Path to a variable file ending in .vars.yaml or .vars.yml (repeatable; later files take priority)
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    rudder-cli validate --location ./project
    rudder-cli validate --location ./project --var-file production.vars.yaml
see_also:
    - rudder-cli - Manage RudderStack resources as code
