name: rudder-cli completion bash
synopsis: Generate the autocompletion script for bash
description: |
    Generate the autocompletion script for the bash shell.

    The generated script requires the bash-completion package. Source the script
    for the current shell or install it in your bash completion directory so new
    shells load rudder-cli completions automatically.
usage: rudder-cli completion bash
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for bash
    - name: no-descriptions
      default_value: "false"
      usage: disable completion descriptions
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    # Load completions for the current shell
    source <(rudder-cli completion bash)

    # Install completions system-wide on Linux
    rudder-cli completion bash > /etc/bash_completion.d/rudder-cli
see_also:
    - rudder-cli completion - Generate shell completion scripts
