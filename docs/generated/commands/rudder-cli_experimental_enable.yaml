name: rudder-cli experimental enable
synopsis: Enable an experimental flag
description: Enable a specific experimental flag by name
usage: rudder-cli experimental enable <flag-name> [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for enable
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    RUDDERSTACK_CLI_EXPERIMENTAL=true rudder-cli experimental enable importMerge
see_also:
    - rudder-cli experimental - Manage experimental features
