name: rudder-cli experimental reset
synopsis: Reset all experimental flags to their defaults
description: |
    Reset all experimental flags by removing the experimental section from the configuration
usage: rudder-cli experimental reset [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for reset
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    RUDDERSTACK_CLI_EXPERIMENTAL=true rudder-cli experimental reset
see_also:
    - rudder-cli experimental - Manage experimental features
