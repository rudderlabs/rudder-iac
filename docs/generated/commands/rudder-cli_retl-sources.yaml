name: rudder-cli retl-sources
synopsis: Manage RETL sources
description: |
    Preview or validate reverse ETL SQL model resources declared in a local project.
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for retl-sources
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    rudder-cli retl-sources validate my-model --location ./project
see_also:
    - rudder-cli - Manage RudderStack resources as code
    - rudder-cli retl-sources preview - Preview a RETL source (SQL model or table)
    - rudder-cli retl-sources validate - Validate a RETL source (SQL model or table)
