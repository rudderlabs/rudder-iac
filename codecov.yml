coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
ignore:
  - "**/mock_*.go"
  - "**/*.pb.go"
  - "*.pb.go"

# Coverage arrives from two jobs under two flags. Neither flag is carried forward:
# every code-changing pull request and push must report the coverage it actually ran.
flags:
  unit:
    carryforward: false
  e2e:
    carryforward: false
