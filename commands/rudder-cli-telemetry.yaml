name: rudder-cli telemetry
synopsis: Manage telemetry settings
description: |
    Manage telemetry settings for the CLI.

    Telemetry helps us understand how the CLI is being used and helps us improve it.
    No sensitive information is collected. The data collected includes:
    - Command usage statistics
    - Error occurrences (without sensitive details)
    - Basic system information

    Use 'status' to check current telemetry settings.
    Use 'enable' or 'disable' to modify telemetry collection.
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for telemetry
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |4-
      rudder-cli telemetry status
      rudder-cli telemetry disable
see_also:
    - rudder-cli - Manage RudderStack resources as code
    - rudder-cli telemetry disable - Disable telemetry
    - rudder-cli telemetry enable - Enable telemetry
    - rudder-cli telemetry status - Show current telemetry status
