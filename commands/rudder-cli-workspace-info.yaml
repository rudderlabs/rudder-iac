name: rudder-cli workspace info
synopsis: Show information about the authenticated workspace
description: |
    Fetch and display identity, environment, status, region, and data-plane details for the workspace associated with the configured access token. Use --json for machine-readable output.
usage: rudder-cli workspace info [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for info
    - name: json
      default_value: "false"
      usage: Output workspace information as JSON
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |4-
      rudder-cli workspace info
      rudder-cli workspace info --json
see_also:
    - rudder-cli workspace - Inspect workspace resources
