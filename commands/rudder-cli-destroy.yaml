name: rudder-cli destroy
synopsis: Delete all resources from both the upstream system and state
description: |
    Deletes all resources from both the upstream system and local state.
    This operation is destructive and will remove ALL resources managed
    by the CLI, regardless of any configuration files.
    Use with extreme caution.
usage: rudder-cli destroy [flags]
options:
    - name: confirm
      default_value: "true"
      usage: Confirm before destroying resources
    - name: dry-run
      default_value: "false"
      usage: |
        Only show the resources that would be destroyed without actually destroying them
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for destroy
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    $ rudder-cli destroy
    $ rudder-cli destroy --dry-run
    $ rudder-cli destroy --confirm=false
see_also:
    - rudder-cli - Manage RudderStack resources as code
