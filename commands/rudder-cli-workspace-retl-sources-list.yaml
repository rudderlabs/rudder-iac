name: rudder-cli workspace retl-sources list
synopsis: List RETL sources in the workspace
description: |
    List RETL SQL model sources from the authenticated workspace. Results are printed as a table unless --json is supplied.
usage: rudder-cli workspace retl-sources list [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for list
    - name: json
      default_value: "false"
      usage: Output as JSON
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |4-
      rudder-cli workspace retl-sources list
      rudder-cli workspace retl-sources list --json
see_also:
    - rudder-cli workspace retl-sources - Inspect RETL sources in the workspace
