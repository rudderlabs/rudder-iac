name: rudder-cli workspace accounts list
synopsis: List accounts in the workspace
description: |
    List workspace accounts, optionally filtered by account category or type. Results are printed as a table unless --json is supplied.
usage: rudder-cli workspace accounts list [flags]
options:
    - name: category
      usage: Filter by account category
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for list
    - name: json
      default_value: "false"
      usage: Output as JSON
    - name: type
      usage: Filter by account type
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |4-
      rudder-cli workspace accounts list
      rudder-cli workspace accounts list --type DESTINATION_SNOWFLAKE --json
see_also:
    - rudder-cli workspace accounts - Inspect accounts in the workspace
