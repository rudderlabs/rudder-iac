name: rudder-cli apply
synopsis: Apply project configuration changes
description: |
    Apply local project specs to the RudderStack workspace associated with the configured access token.
    The command validates the project, compares it with remote state, then creates, updates, imports,
    or deletes resources in dependency order. Use --dry-run to inspect the plan without changing the
    workspace, --confirm=false for non-interactive execution, and repeat --var-file to resolve variables.
usage: rudder-cli apply [flags]
options:
    - name: confirm
      default_value: "true"
      usage: Confirm changes before applying them
    - name: dry-run
      default_value: "false"
      usage: Only show the changes without applying them
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for apply
    - name: location
      shorthand: l
      default_value: .
      usage: |
        Path to the directory containing the project files or a specific file
    - name: var-file
      default_value: '[]'
      usage: |
        Path to a variable file ending in .vars.yaml or .vars.yml (repeatable; later files take priority)
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    $ rudder-cli apply --location </path/to/dir or file>
    $ rudder-cli apply --location </path/to/dir or file> --dry-run
    $ rudder-cli apply --location </path/to/dir or file> --confirm=false
see_also:
    - rudder-cli - Manage RudderStack resources as code
