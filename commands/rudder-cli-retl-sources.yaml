name: rudder-cli retl-sources
synopsis: Manage RETL sources
description: |
    Validate or preview RETL SQL model source specs from a local project before applying them. Select a source by its external ID and use --location when the project is not in the current directory.
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for retl-sources
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |4-
      rudder-cli retl-sources validate orders-model --location ./project
      rudder-cli retl-sources preview orders-model --limit 5
see_also:
    - rudder-cli - Manage RudderStack resources as code
    - rudder-cli retl-sources preview - Preview a RETL source SQL model
    - rudder-cli retl-sources validate - Validate a RETL source SQL model
