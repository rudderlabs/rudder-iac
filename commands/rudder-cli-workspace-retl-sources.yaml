name: rudder-cli workspace retl-sources
synopsis: Inspect RETL sources in the workspace
description: |
    Inspect RETL SQL model sources in the authenticated workspace. Use the list subcommand for table or JSON output.
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for retl-sources
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: '  rudder-cli workspace retl-sources list --json'
see_also:
    - rudder-cli workspace - Inspect workspace resources
    - rudder-cli workspace retl-sources list - List RETL sources in the workspace
