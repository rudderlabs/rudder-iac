name: rudder-cli telemetry disable
synopsis: Disable telemetry
description: |
    Disable rudder-cli usage and error telemetry in the selected configuration file.
usage: rudder-cli telemetry disable [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for disable
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: '  rudder-cli telemetry disable'
see_also:
    - rudder-cli telemetry - Manage telemetry settings
