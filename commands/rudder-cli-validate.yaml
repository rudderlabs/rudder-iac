name: rudder-cli validate
synopsis: Validate project configuration
description: |
    Validate local RudderStack project files without applying changes.
    The command checks strict YAML syntax, required fields, provider rules, resource references,
    dependency cycles, and workspace-aware constraints. Use --location for a file or directory and
    repeat --var-file to resolve environment-specific values before validation.
usage: rudder-cli validate [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for validate
    - name: location
      shorthand: l
      default_value: .
      usage: |
        Path to the directory containing the project files or a specific file
    - name: var-file
      default_value: '[]'
      usage: |
        Path to a variable file ending in .vars.yaml or .vars.yml (repeatable; later files take priority)
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    $ rudder-cli validate --location </path/to/dir or file>
see_also:
    - rudder-cli - Manage RudderStack resources as code
