name: rudder-cli workspace event-stream-sources list
synopsis: List event stream sources in the workspace
description: |
    List event stream sources from the authenticated workspace, including their IDs, names, types, and enabled state. Use --json for machine-readable output.
usage: rudder-cli workspace event-stream-sources list [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for list
    - name: json
      default_value: "false"
      usage: Output as JSON
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |4-
      rudder-cli workspace event-stream-sources list
      rudder-cli workspace event-stream-sources list --json
see_also:
    - rudder-cli workspace event-stream-sources - Manage event stream sources in the workspace
