name: rudder-cli data-graphs
synopsis: Manage data graphs
description: |
    Validate data graph models and relationships in a local project against their warehouse account. Use the validate subcommand to check all, modified, or one selected resource.
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for data-graphs
inherited_options:
    - name: config
      shorthand: c
      default_value: ~/.rudder/config.json
      usage: config file (default is '~/.rudder/config.json')
example: |
    $ rudder-cli data-graphs validate --all
    $ rudder-cli data-graphs validate --modified
    $ rudder-cli data-graphs validate model my-model-id
see_also:
    - rudder-cli - Manage RudderStack resources as code
    - rudder-cli data-graphs validate - Validate data graph resources
