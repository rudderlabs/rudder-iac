name: test with code coverage
on:
  push:
    branches:
      - main
      - "release/*"
    # Docs cannot change Go behaviour. Safe only while this workflow is NOT a required
    # status check: the org ruleset master-branch-protection (id 4378086) carries only
    # deletion, non_fast_forward and pull_request rules. If it is ever made required, a
    # skipped run leaves the PR pending forever and this must become a job-level gate.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - ".agents/**"
  pull_request:
    branches:
      - main
    # Keep in sync with the push filter above; Actions does not support YAML anchors.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - ".agents/**"

# Supersession, keyed per PR: a new commit cancels the older run of that same PR
# instead of letting every intermediate commit spend a full e2e suite against the live
# workspace. Cancelling mid-apply is safe because every e2e test opens with
# `destroy --confirm=false`, and because each of them turns
# RUDDERSTACK_X_UNVERIFIED_DESTINATIONS on for itself (see
# allowManagedResidue) — without that flag, destinations left behind
# by a killed run make the next run's opening destroy fail on an unregistered type.
#
# Keyed on the PR number, not github.head_ref: head_ref is only a branch name, so two
# PRs sharing one (typically from different forks) would cancel each other. The number
# is unset outside pull_request, so push runs fall back to github.run_id: a group of
# one, never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    name: "unit tests"
    runs-on: "ubuntu-24.04"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Neither job pushes; both upload artifacts. Don't leave the git
          # credential on disk where an upload could capture it (zizmor
          # artipacked). Matches gen-rule-docs.yml.
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          check-latest: true
          cache: true
          go-version: "~1.25"

      - name: checking go version
        run: go version

      # No concurrency group on purpose: unit runs are free to overlap across PRs,
      # which is what keeps a fast signal on every PR now that queued e2e runs get
      # superseded.
      #
      # `make test` excludes ./cli/tests, but it is not offline: cli/pkg/exp/project's
      # TestProjectLoad calls project.Load, which builds app deps and so requires a
      # token before it ever reads a spec off disk. It performs no writes — Load only
      # loads specs locally and returns a resource graph — so this job stays outside
      # the e2e mutex.
      - name: running unit tests
        run: make test
        env:
          RUDDERSTACK_API_URL: ${{ vars.RUDDERSTACK_API_URL }}
          RUDDERSTACK_ACCESS_TOKEN: ${{ secrets.RUDDERSTACK_ACCESS_TOKEN }}

      - name: upload unit coverage to Codecov
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: rudderlabs/rudder-iac
          flags: unit
          disable_search: true
          files: coverage-unit.out

  e2e:
    # Internal name. The check people read is the `e2e-result` job below, which
    # reports this one's outcome and distinguishes "failed" from "never got a turn".
    name: "e2e tests (run)"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30
    # Keep the push run as the final verification of the tree that actually landed.
    # A pull request's merge ref can become stale when main advances, and this workflow
    # is not a required status check, so its PR run cannot replace the post-merge run.
    #
    # The mutex over the single shared workspace. These tests open with a workspace-wide
    # destroy and count-guard their snapshots over every managed resource, so two must
    # never overlap.
    #
    # cancel-in-progress stays false — supersession belongs to the workflow-level group
    # above, not here. Do not add `queue: max`: the default single-pending-slot
    # behaviour drops redundant queued runs, which is itself a saving.
    #
    # That single-pending-slot behaviour is also this group's one sharp edge, and the
    # reason the `e2e-result` job exists. A concurrency group holds at most one running
    # and one pending job: when a third arrives, the *pending* one is cancelled outright.
    # With several PRs pushing at once that is routine — on 16 Sep, #847's queued job was
    # evicted by runs from #849 and #851 ninety seconds later, and surfaced on #847 as a
    # red check on a tree whose e2e had passed twice. Eviction is a scheduling outcome,
    # not a test result, so it must not be reported as one.
    #
    # The group name is deliberately the one the pre-split workflow used. Renaming it
    # would open a window where a run on the old definition and a run on the new one
    # hold different group names and write to the same workspace at once.
    concurrency:
      group: test-and-upload-code-coverage
      cancel-in-progress: false
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Neither job pushes; both upload artifacts. Don't leave the git
          # credential on disk where an upload could capture it (zizmor
          # artipacked). Matches gen-rule-docs.yml.
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          check-latest: true
          cache: true
          go-version: "~1.25"

      - name: checking go version
        run: go version

      - name: running e2e tests
        run: make test-e2e
        env:
          RUDDERSTACK_API_URL: ${{ vars.RUDDERSTACK_API_URL }}
          RUDDERSTACK_ACCESS_TOKEN: ${{ secrets.RUDDERSTACK_ACCESS_TOKEN }}
          RUDDERSTACK_CLI_DEBUG: ${{ vars.RUDDERSTACK_CLI_DEBUG }}
          RUDDERSTACK_CLI_TELEMETRY_DISABLED: ${{ vars.RUDDERSTACK_CLI_TELEMETRY_DISABLED }}
          RUDDERSTACK_CLI_EXPERIMENTAL: ${{ vars.RUDDERSTACK_CLI_EXPERIMENTAL }}
          # Matters because runs now get cancelled: a run killed mid-
          # TestDestinationsApply skips its t.Cleanup destroy and leaves unverified
          # destinations upstream, and with the flag off the next run's opening
          # destroy fails hard in destination LoadResources ("managed destination ...
          # has unregistered type"), which needs manual repair. Every e2e test already
          # sets it for itself via allowManagedResidue, so this is a
          # backstop for one that forgets and a way to flip it without a code change.
          # The variable does not exist yet; unset, this resolves to empty.
          RUDDERSTACK_X_UNVERIFIED_DESTINATIONS: ${{ vars.RUDDERSTACK_X_UNVERIFIED_DESTINATIONS }}
          # RUN_DESTINATION_E2E is deliberately not passed: TestDestinationsApply
          # makes ~225 destination writes, each posting to the production outbox, so
          # it runs once a day in destination-e2e-nightly.yml instead of on every
          # commit.
          #
          # Gates TestConnectionsApply, which opens with the same workspace-wide
          # destroy. Same rule: set the repository variable to 1 only while that
          # workspace is disposable.
          RUN_CONNECTION_E2E: ${{ vars.RUN_CONNECTION_E2E }}

      # Only this job drives the binary, so only it produces CLI logs. upload-artifact
      # rejects a duplicate artifact name within a run, so the unit job must not also
      # upload one. if-no-files-found: a cancelled run may die before the log exists.
      - name: upload cli logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cli.log
          path: ~/.rudder/cli.log
          if-no-files-found: ignore

      - name: upload e2e coverage to Codecov
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: rudderlabs/rudder-iac
          flags: e2e
          disable_search: true
          files: coverage-e2e.out

  # The check the PR surface shows for e2e. It exists to tell two things apart that
  # GitHub renders identically on the `e2e` job:
  #
  #   failure   — the suite ran and something broke. Red, and it should be.
  #   cancelled — the job never started (0 steps): evicted from the shared-workspace
  #               queue by a later run, so this tree got no e2e signal at all.
  #
  # The second is not a result about the code, so it does not fail the PR — but it is
  # not silently green either: the job writes to the step summary and annotates the run,
  # so "e2e did not run" is visible rather than inferred from a green tick.
  #
  # A cancellation of the whole workflow run (someone hits cancel, or the workflow-level
  # per-PR group supersedes it) cancels this job too, so it cannot mask that case.
  # `main`'s post-merge run remains the authority either way.
  e2e-result:
    name: "e2e tests (live control plane)"
    runs-on: "ubuntu-24.04"
    needs: [e2e]
    if: always()
    steps:
      - name: report the e2e outcome
        env:
          RESULT: ${{ needs.e2e.result }}
        run: |
          case "$RESULT" in
            success)
              echo "e2e suite passed." >> "$GITHUB_STEP_SUMMARY"
              ;;
            skipped)
              echo "e2e suite skipped for this run." >> "$GITHUB_STEP_SUMMARY"
              ;;
            cancelled)
              echo "::warning title=e2e did not run::Evicted from the shared-workspace queue by a later run, so this tree has no e2e signal. Re-run the job to get one; main's post-merge run is the authority."
              {
                echo "### e2e did not run"
                echo
                echo "The suite holds a mutex over a single shared workspace. A concurrency group"
                echo "keeps at most one running and one pending job, so a later run evicted this"
                echo "one before it started — **this is a scheduling outcome, not a test result**."
                echo
                echo "Re-run the \`e2e tests (run)\` job to get a signal for this tree."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error title=e2e failed::The e2e suite ran and failed. See the 'e2e tests (run)' job."
              echo "### e2e suite failed" >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
