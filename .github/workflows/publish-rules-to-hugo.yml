name: publish rules to rudder-hugo

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "rudder-iac release tag to publish rules from (for example, v1.2.3)"
        required: true
        type: string
      upload_release_asset:
        description: "Replace rules.yaml on the selected GitHub release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-rules-${{ github.event.release.tag_name || github.event.client_payload.tag || inputs.tag }}
  cancel-in-progress: false

jobs:
  generate:
    name: "generate validation rule catalog"
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-${DISPATCH_TAG:-${INPUT_TAG:-}}}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Expected a semantic release tag such as v1.2.3"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout rudder-iac release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Generate rule catalog
        env:
          TAG: ${{ steps.release.outputs.tag }}
          RUDDERSTACK_CLI_EXPERIMENTAL: 'true'
          RUDDERSTACK_X_IMPORT_MERGE: 'true'
          RUDDERSTACK_X_RETL_TABLE_SUPPORT: 'true'
          RUDDERSTACK_X_RETL_CONNECTION_SUPPORT: 'true'
        run: go run -ldflags "-X main.version=${TAG}" ./cli/cmd/gen-rule-docs --output-dir docs/generated

      - name: Verify catalog metadata
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          catalog_version="$(awk '$1 == "cli_version:" { gsub(/\"/, "", $2); print $2; exit }' docs/generated/rules.yaml)"
          rule_count="$(grep -c '^[[:space:]]*- rule_id:' docs/generated/rules.yaml)"
          test -s docs/generated/rules.yaml
          test "$catalog_version" = "$VERSION"
          test "$rule_count" -gt 0

      - name: Upload rule catalog for publishing jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-rule-catalog
          path: docs/generated/rules.yaml
          if-no-files-found: error

  upload-release-asset:
    name: "attach validation rule catalog to release"
    if: github.event_name == 'release' || inputs.upload_release_asset
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Download rule catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-rule-catalog
          path: docs/generated

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.generate.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "false"
          gh release upload "$TAG" docs/generated/rules.yaml --clobber

  publish-hugo:
    name: "publish validation rule catalog to rudder-hugo"
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Download rule catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-rule-catalog
          path: docs/generated

      # GITHUB_TOKEN cannot write to another repository. This installation token
      # is short-lived and scoped to rudderlabs/rudder-hugo.
      - name: Generate rudder-hugo token
        id: hugo-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          owner: rudderlabs
          repositories: rudder-hugo
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout rudder-hugo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: rudderlabs/rudder-hugo
          token: ${{ steps.hugo-token.outputs.token }}
          path: rudder-hugo
          fetch-depth: 0
          persist-credentials: false

      - name: Publish raw catalog and open pull request
        working-directory: rudder-hugo
        env:
          GH_TOKEN: ${{ steps.hugo-token.outputs.token }}
          TAG: ${{ needs.generate.outputs.tag }}
          VERSION: ${{ needs.generate.outputs.version }}
        run: |
          set -euo pipefail
          branch="auto/rudder-cli-rules-${VERSION}"
          file="data/rudder-cli-rules.raw.yaml"

          branch_exists=false
          git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
            branch_exists=true
            unexpected_files="$(git diff --name-only origin/main..."origin/${branch}" | grep -vxF "$file" || true)"
            if [[ -n "$unexpected_files" ]]; then
              echo "::error::Existing publication branch changes files other than ${file}:"
              echo "$unexpected_files"
              exit 1
            fi
          fi
          git switch -C "$branch" origin/main

          cp ../docs/generated/rules.yaml "$file"
          changed_files="$(git status --porcelain --untracked-files=all | cut -c4- | grep -vxF "$file" || true)"
          if [[ -n "$changed_files" ]]; then
            echo "::error::Publication would change files other than ${file}:"
            echo "$changed_files"
            exit 1
          fi
          if git diff --quiet -- "$file"; then
            echo "Catalog unchanged; nothing to publish."
            exit 0
          fi

          git config user.name "rudderstack-cli-bot[bot]"
          git config user.email "rudderstack-cli-bot[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "chore: update rudder-cli validation rules (${TAG})"

          gh auth setup-git
          if [[ "$branch_exists" == true ]]; then
            git push --force-with-lease="refs/heads/${branch}:$(git rev-parse "origin/${branch}")" origin "HEAD:refs/heads/${branch}"
          else
            git push origin "HEAD:refs/heads/${branch}"
          fi

          title="chore: update rudder-cli validation rules (${TAG})"
          body="$(cat <<EOF
          Auto-generated from [rudder-iac ${TAG}](https://github.com/rudderlabs/rudder-iac/releases/tag/${TAG}).

          Updates \`data/rudder-cli-rules.raw.yaml\` only. The rudder-hugo merge workflow regenerates \`data/rudder-cli-rules.yaml\` with editorial overrides.
          EOF
          )"
          if gh pr view "$branch" --repo rudderlabs/rudder-hugo >/dev/null 2>&1; then
            gh pr edit "$branch" --repo rudderlabs/rudder-hugo --title "$title" --body "$body"
          else
            gh pr create --repo rudderlabs/rudder-hugo --base main --head "$branch" --title "$title" --body "$body"
          fi
dy"
          fi
