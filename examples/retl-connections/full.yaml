version: rudder/v1
kind: retl-connections
metadata:
  name: full-retl-connection
spec:
  connections:
    - id: full-retl-connection
      source: "#retl-source-sql-model:full-retl-model"
      destination: "#destination:full-retl-destination"
      enabled: true
      config:
        sync_behaviour: upsert
        schedule:
          type: cron
          cron_expression: "0 * * * *"
        identifiers:
          - from: customer_id
            to: user_id
        mappings:
          - from: email
            to: traits.email
          - from: plan
            to: traits.plan
        constants:
          - key: source
            value: warehouse
        event:
          type: identify
        cursor_column: updated_at
        sync_settings:
          sync_logs:
            enabled: true
            retention_days: 7
            snapshots_to_retain: 3
          failed_keys:
            retry: true
