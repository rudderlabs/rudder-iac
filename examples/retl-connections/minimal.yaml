version: rudder/v1
kind: retl-connections
metadata:
  name: customer-syncs
spec:
  connections:
    - id: customers-to-webhook
      source: "#retl-source-sql-model:customers-model"
      destination: "#destination:customer-webhook"
      config:
        sync_behaviour: upsert
        schedule:
          type: manual
        identifiers:
          - from: id
            to: user_id
        mappings:
          - from: email
            to: traits.email
        event:
          type: identify
