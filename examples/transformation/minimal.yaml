version: rudder/v1
kind: transformation
metadata:
  name: add-source
spec:
  id: add-source
  name: Add Source
  description: Adds a source marker to each event.
  language: javascript
  code: |
    export function transformEvent(event, metadata) {
      event.context = event.context || {};
      event.context.source = 'rudder-cli';
      return event;
    }
