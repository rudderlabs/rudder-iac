version: rudder/v1
kind: account
metadata:
  name: minimal-postgres-account
spec:
  id: minimal-postgres-account
  name: Minimal Postgres Account
  account_definition_name: SOURCE_POSTGRES
  config:
    host: postgres.example.com
    dbname: analytics
    user: rudder
    port: 5432
    sslMode: require
    password: replace-with-postgres-password
