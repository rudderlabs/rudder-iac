version: rudder/v1
kind: account
metadata:
  name: analytics-postgres
spec:
  id: analytics-postgres
  name: Analytics Postgres
  account_definition_name: SOURCE_POSTGRES
  config:
    host: postgres.example.com
    dbname: analytics
    user: rudder
    port: 5432
    sslMode: require
    password: replace-with-your-password
