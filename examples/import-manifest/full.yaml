version: rudder/v1
kind: import-manifest
metadata:
  name: full-import-manifest
spec:
  workspaces:
    - workspace_id: workspace-production
      resources:
        - urn: property:imported_order_total
          remote_id: prop_remote_order_total
        - urn: property:imported_signup_source
          remote_id: prop_remote_signup_source
    - workspace_id: workspace-staging
      resources:
        - urn: property:imported_order_total
          remote_id: prop_remote_order_total_staging
